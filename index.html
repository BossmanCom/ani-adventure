    // True background pixels: bright + low color (won't eat peach skin / orange onesie / green hair)
    function isBgPixel(r, g, b) {
      const maxc = Math.max(r, g, b);
      const minc = Math.min(r, g, b);
      const lum = (r + g + b) / 3;
      const sat = maxc - minc;
      return lum >= 210 && sat <= 28;
    }

    // Flood-fill white/near-white from the edges so enclosed white (ears, tail tip) stays
    function stripWhiteBackground(data, w, h) {
      const n = w * h;
      const bg = new Uint8Array(n); // 1 = background
      const stack = [];

      function trySeed(x, y) {
        if (x < 0 || y < 0 || x >= w || y >= h) return;
        const i = y * w + x;
        if (bg[i]) return;
        const p = i * 4;
        if (isBgPixel(data[p], data[p + 1], data[p + 2])) {
          bg[i] = 1;
          stack.push(i);
        }
      }

      // Seed from all edge pixels
      for (let x = 0; x < w; x++) { trySeed(x, 0); trySeed(x, h - 1); }
      for (let y = 0; y < h; y++) { trySeed(0, y); trySeed(w - 1, y); }

      while (stack.length) {
        const i = stack.pop();
        const x = i % w;
        const y = (i - x) / w;
        // 4-neighborhood
        const neighbors = [i - 1, i + 1, i - w, i + w];
        for (let k = 0; k < 4; k++) {
          const j = neighbors[k];
          if (j < 0 || j >= n) continue;
          if (bg[j]) continue;
          // Keep within image row for left/right
          if (k === 0 && x === 0) continue;
          if (k === 1 && x === w - 1) continue;
          const p = j * 4;
          if (isBgPixel(data[p], data[p + 1], data[p + 2])) {
            bg[j] = 1;
            stack.push(j);
          }
        }
      }

      // Clear background + soften anti-aliased halo around the cutout
      for (let i = 0; i < n; i++) {
        const p = i * 4;
        if (bg[i]) {
          data[p + 3] = 0;
          continue;
        }
        const r = data[p], g = data[p + 1], b = data[p + 2];
        const lum = (r + g + b) / 3;
        const sat = Math.max(r, g, b) - Math.min(r, g, b);
        // Soft near-white fringe next to background (removes the boxy halo)
        if (lum > 200 && sat < 40) {
          const x = i % w;
          const y = (i - x) / w;
          let nextToBg = false;
          if (x > 0 && bg[i - 1]) nextToBg = true;
          else if (x < w - 1 && bg[i + 1]) nextToBg = true;
          else if (y > 0 && bg[i - w]) nextToBg = true;
          else if (y < h - 1 && bg[i + w]) nextToBg = true;
          if (nextToBg) {
            // Fade: whiter = more transparent
            const t = Math.min(1, Math.max(0, (lum - 200) / 55));
            data[p + 3] = Math.floor(data[p + 3] * (1 - t * 0.92));
          }
        }
      }
    }

    function getCleanFrame(frameIndex) {
      if (aniFrameCache[frameIndex]) return aniFrameCache[frameIndex];
      if (!sheet.complete || sheet.naturalWidth === 0 || frameW < 1 || frameH < 1) return null;

      const col = frameIndex % 2, row = Math.floor(frameIndex / 2);
      const cached = document.createElement('canvas');
      cached.width = frameW;
      cached.height = frameH;
      const c = cached.getContext('2d');
      try {
        // Sheet is already alpha-cut (ani_sheet_trans.png) — just slice the frame
        c.clearRect(0, 0, frameW, frameH);
        c.drawImage(sheet, col * frameW, row * frameH, frameW, frameH, 0, 0, frameW, frameH);
        // Optional extra cleanup if someone swaps back to the opaque sheet
        try {
          const imgData = c.getImageData(0, 0, frameW, frameH);
          // Only run strip if corners are still opaque white (opaque source)
          const d = imgData.data;
          const cornerWhite = d[0] > 240 && d[1] > 240 && d[2] > 240 && d[3] > 200;
          if (cornerWhite) {
            stripWhiteBackground(d, frameW, frameH);
            c.putImageData(imgData, 0, 0);
          }
        } catch (err) {
          // file:// may block getImageData — transparent PNG doesn't need it
        }
        aniFrameCache[frameIndex] = cached;
        return cached;
      } catch (err) {
        console.warn('Ani frame draw failed:', err.message);
        return null;
      }
    }

    function getCleanNekoFrame(frameIndex) {
      if (nekoFrameCache[frameIndex]) return nekoFrameCache[frameIndex];
      if (!nekoSheet.complete || nekoSheet.naturalWidth === 0 || nekoFrameW < 1 || nekoFrameH < 1) return null;

      const cached = document.createElement('canvas');
      cached.width = nekoFrameW;
      cached.height = nekoFrameH;
      const c = cached.getContext('2d');
      try {
        const fi = Math.max(0, Math.min(NEKO_FRAME_COUNT - 1, frameIndex));
        c.drawImage(nekoSheet, fi * nekoFrameW, 0, nekoFrameW, nekoFrameH, 0, 0, nekoFrameW, nekoFrameH);
        try {
          const imgData = c.getImageData(0, 0, nekoFrameW, nekoFrameH);
          const data = imgData.data;
          for (let i = 0; i < data.length; i += 4) {
            const r = data[i], g = data[i + 1], b = data[i + 2];
            const lum = (r + g + b) / 3;
            // black / near-black bg
            if (lum < 22) { data[i + 3] = 0; continue; }
            // white / near-white labels
            if (r > 220 && g > 220 && b > 220) data[i + 3] = 0;
            else if (r > 200 && g > 200 && b > 190 && Math.abs(r - g) < 20) data[i + 3] = 0;
          }
          c.putImageData(imgData, 0, 0);
        } catch (err) {
          console.warn('Neko background strip skipped:', err.message);
        }
        nekoFrameCache[frameIndex] = cached;
        return cached;
      } catch (err) {
        console.warn('Neko frame draw failed:', err.message);
        return null;
      }
    }

      let dmg = who === 'ani' ? 8 : 7;
      if (who === 'ani' && inventory.indexOf('fox_sword') >= 0) dmg += 3;
      if (who === 'neko' && inventory.indexOf('neko_claws') >= 0) dmg += 3;
      combat.defending[who] = false;
      combat.log = name + ' attacks...';
      // Ani: 5-frame sheet; Neko: 4-frame short-hair swing sheet (frames 1–4)
      combat.anim = {
        who: who,
        type: 'attack',
        frame: 0,
        timer: 0,
        maxFrames: who === 'neko' ? 4 : COMBAT_FRAMES,
        pending: { kind: 'attack', who: who, name: name, dmg: dmg }
      };
    }

    function combatDefend() {
      if (!combat.active || combat.won || combat.anim) return;
      const who = combat.turn;
      const name = who === 'ani' ? 'Ani' : 'Neko';
      combat.defending[who] = true;
      combat.log = name + ' braces to defend...';
      combat.anim = {
        who: who,
        type: 'defend',
        frame: 0,
        timer: 0,
        maxFrames: who === 'neko' ? 2 : COMBAT_FRAMES,
        pending: { kind: 'defend', who: who, name: name }
      };
    }

    function finishCombatAction() {
      if (!combat.anim || !combat.anim.pending) {
        combat.anim = null;
        return;
      }
      const p = combat.anim.pending;
      combat.anim = null;

      if (p.kind === 'attack') {
        combat.dummyHp = Math.max(0, combat.dummyHp - p.dmg);
        combat.log = p.name + ' hits for ' + p.dmg + '!';
        if (combat.dummyHp <= 0) {
          combat.won = true;
          combat.log = p.name + ' lands the finishing blow! Training complete.';
          activeMenu = null;
          return;
        }
        dummyCounterstrike(p.name, p.who);
      } else {
        combat.log = p.name + ' braces to defend.';
        dummyCounterstrike(p.name, p.who);
      }
      advanceCombatTurn();
    }

    function dummyCounterstrike(targetName, who) {
      if (combat.won || combat.dummyHp <= 0) return;
      let dmg = 4;
      if (combat.defending[who]) {
        dmg = 1;
        combat.log += ' Dummy hits ' + targetName + ' for ' + dmg + ' (blocked).';
      } else {
        combat.log += ' Dummy hits ' + targetName + ' for ' + dmg + '.';
      }
    }

    function advanceCombatTurn() {
      combat.turn = combat.turn === 'ani' ? 'neko' : 'ani';
      const next = combat.turn === 'ani' ? 'Ani' : 'Neko';
      if (!combat.won) {
        combat.log += '  → ' + next + "'s turn.";
      }
    }

    // Combat sheets are 4 columns × 3 rows:
    //   left half (cols 0-1) = Ani, right half (cols 2-3) = Neko
    //   5 poses in a 2×3 block (reading order; 5th = bottom-right cell)
    function getCombatPose(who, type, frameIndex) {
      const key = 'v2_' + type + '_' + who + '_' + frameIndex;
      if (combatFrameCache[key]) return combatFrameCache[key];
      const sheetImg = type === 'defend' ? combatDefendSheet : combatAttackSheet;
      if (!sheetImg.complete || !sheetImg.naturalWidth) return null;

      const cols = 4;
      const rows = 3;
      const fw = Math.floor(sheetImg.naturalWidth / cols);
      const fh = Math.floor(sheetImg.naturalHeight / rows);

      // Local 2×3 block positions for frames 0..4
      const localOrder = [
        [0, 0], // 1
        [1, 0], // 2
        [0, 1], // 3
        [1, 1], // 4
        [1, 2]  // 5 (bottom-right of character block)
      ];
      const fi = Math.max(0, Math.min(COMBAT_FRAMES - 1, frameIndex));
      const lc = localOrder[fi][0];
      const lr = localOrder[fi][1];
      // Neko is on the right half of the sheet
      const col = who === 'neko' ? lc + 2 : lc;
      const row = lr;

      // Inset so we don't pull in neighbor poses / labels
      const padX = Math.floor(fw * 0.06);
      const padY = Math.floor(fh * 0.08);
      const sx = col * fw + padX;
      const sy = row * fh + padY;
      const sw = fw - padX * 2;
      const sh = fh - padY * 2;

      const cached = document.createElement('canvas');
      cached.width = sw;
      cached.height = sh;
      const c = cached.getContext('2d');
      try {
        c.clearRect(0, 0, sw, sh);
        c.drawImage(sheetImg, sx, sy, sw, sh, 0, 0, sw, sh);
        // Strip black / near-black sheet background
        try {
          const imgData = c.getImageData(0, 0, sw, sh);
          const data = imgData.data;
          for (let i = 0; i < data.length; i += 4) {
            const r = data[i], g = data[i + 1], b = data[i + 2];
            const maxc = Math.max(r, g, b);
            const minc = Math.min(r, g, b);
            const lum = (r + g + b) / 3;
            if (lum < 22) { data[i + 3] = 0; continue; }
            if (lum > 230 && (maxc - minc) < 30) { data[i + 3] = 0; continue; }
          }
          c.putImageData(imgData, 0, 0);
        } catch (err) { /* file:// may block */ }
        combatFrameCache[key] = cached;
        return cached;
      } catch (err) {
        return null;
      }
    }

    // Draw short-hair Neko from her walk sheet (overworld)
    function drawNekoShortHair(feetX, feetY, frameIndex, scaleMul) {
      const mul = scaleMul == null ? 1 : scaleMul;
      const clean = getCleanNekoFrame(frameIndex);
      const dw = nekoFrameW * neko.scale * mul;
      const dh = nekoFrameH * neko.scale * mul;
      const dx = feetX - dw / 2;
      const dy = feetY - dh;

      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.beginPath();
      ctx.ellipse(feetX, feetY - 4, dw * 0.28, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      if (clean) {
        ctx.save();
        if (neko.facing === -1) {
          ctx.translate(feetX, 0);
          ctx.scale(-1, 1);
          ctx.drawImage(clean, 0, 0, nekoFrameW, nekoFrameH, -dw / 2, dy, dw, dh);
        } else {
          ctx.drawImage(clean, 0, 0, nekoFrameW, nekoFrameH, dx, dy, dw, dh);
        }
        ctx.restore();
      }
      return { dx: dx, dy: dy, dw: dw, dh: dh };
    }

    // Neko short-hair attack sheet: 2×2 main poses
    // 0 wind-up, 1 mid slash, 2 follow-through, 3 idle stance
    function getNekoSwingPose(frameIndex) {
      const key = 'neko_swing_' + frameIndex;
      if (combatFrameCache[key]) return combatFrameCache[key];
      if (!nekoAttackSheet.complete || !nekoAttackSheet.naturalWidth) return null;

      const cols = 2, rows = 2;
      const fw = Math.floor(nekoAttackSheet.naturalWidth / cols);
      const fh = Math.floor(nekoAttackSheet.naturalHeight / rows);
      const fi = Math.max(0, Math.min(3, frameIndex));
      const col = fi % 2;
      const row = Math.floor(fi / 2);

      // Inset: bottom row has tiny reference art — crop more from bottom
      const padX = Math.floor(fw * 0.06);
      const padTop = Math.floor(fh * 0.06);
      const padBot = row === 1 ? Math.floor(fh * 0.22) : Math.floor(fh * 0.08);
      const sx = col * fw + padX;
      const sy = row * fh + padTop;
      const sw = fw - padX * 2;
      const sh = fh - padTop - padBot;

      const cached = document.createElement('canvas');
      cached.width = sw;
      cached.height = sh;
      const c = cached.getContext('2d');
      try {
        c.clearRect(0, 0, sw, sh);
        c.drawImage(nekoAttackSheet, sx, sy, sw, sh, 0, 0, sw, sh);
        try {
          const imgData = c.getImageData(0, 0, sw, sh);
          const data = imgData.data;
          for (let i = 0; i < data.length; i += 4) {
            const lum = (data[i] + data[i + 1] + data[i + 2]) / 3;
            if (lum < 22) data[i + 3] = 0;
          }
          c.putImageData(imgData, 0, 0);
        } catch (err) { /* file:// */ }
        combatFrameCache[key] = cached;
        return cached;
      } catch (err) {
        return null;
      }
    }

    // Draw fighter — Ani: long swing sheets; Neko: short-hair swing sheet 1–4 for attack
    function drawCombatFighter(who, feetX, feetY) {
      const targetH = frameH * ani.scale * 0.95;

      // ---- Neko: short-hair only ----
      if (who === 'neko') {
        let pose = null;
        if (combat.anim && combat.anim.who === 'neko' && combat.anim.type === 'attack') {
          // Swing frames 1–4 (indices 0–3)
          pose = getNekoSwingPose(combat.anim.frame);
        } else if (combat.anim && combat.anim.who === 'neko' && combat.anim.type === 'defend') {
          // Defend: idle stance (frame 4) then slight crouch (frame 1)
          pose = getNekoSwingPose(combat.anim.frame === 0 ? 3 : 0);
        } else if (combat.defending.neko) {
          pose = getNekoSwingPose(3); // idle combat stance
        } else {
          pose = getNekoSwingPose(3); // ready idle in battle
        }

        if (!pose) {
          drawNekoShortHair(feetX, feetY, NEKO_IDLE, 0.95);
        } else {
          const sc = targetH / pose.height;
          const dw = pose.width * sc;
          const dh = pose.height * sc;
          const dx = feetX - dw / 2;
          const dy = feetY - dh;
          ctx.fillStyle = 'rgba(0,0,0,0.28)';
          ctx.beginPath();
          ctx.ellipse(feetX, feetY - 2, dw * 0.28, 8, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.drawImage(pose, dx, dy, dw, dh);

          if (combat.active && !combat.won && combat.turn === 'neko' && !combat.anim) {
            ctx.fillStyle = '#c9a0ff';
            ctx.font = 'bold 11px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText('▼', feetX, dy - 6);
            ctx.textAlign = 'left';
          }
        }
        return;
      }

      // ---- Ani: attack/defend swing sheets ----
      let type = 'attack';
      let frame = 0;
      if (combat.defending.ani && !(combat.anim && combat.anim.who === 'ani')) {
        type = 'defend';
        frame = 0;
      }
      if (combat.anim && combat.anim.who === 'ani') {
        type = combat.anim.type;
        frame = combat.anim.frame;
      }

      const pose = getCombatPose('ani', type, frame);

      if (!pose) {
        const clean = getCleanFrame(IDLE_FRAME);
        if (clean) {
          const dw = frameW * ani.scale * 0.9, dh = frameH * ani.scale * 0.9;
          ctx.drawImage(clean, 0, 0, frameW, frameH, feetX - dw / 2, feetY - dh, dw, dh);
        }
        return;
      }

      const sc = targetH / pose.height;
      const dw = pose.width * sc;
      const dh = pose.height * sc;
      const dx = feetX - dw / 2;
      const dy = feetY - dh;

      ctx.fillStyle = 'rgba(0,0,0,0.28)';
      ctx.beginPath();
      ctx.ellipse(feetX, feetY - 2, dw * 0.28, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.drawImage(pose, dx, dy, dw, dh);

      if (combat.active && !combat.won && combat.turn === 'ani' && !combat.anim) {
        ctx.fillStyle = '#ff9a4a';
        ctx.font = 'bold 11px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('▼', feetX, dy - 6);
        ctx.textAlign = 'left';
      }
    }

    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
      const my = (e.clientY - rect.top) * (canvas.height / rect.height);

      // If a menu is open, handle menu clicks first
      if (activeMenu === 'map') {
        // Close button (top right of map panel)
        if (mx >= 520 && mx <= 555 && my >= 55 && my <= 90) {
          activeMenu = null;
          return;
        }
        // Clicking outside the map panel also closes it
        if (mx < 80 || mx > 560 || my < 50 || my > 430) {
          activeMenu = null;
          return;
        }
        // Travel to map locations
        for (let i = 0; i < mapLocations.length; i++) {
          const loc = mapLocations[i];
          if (loc.locked) continue;
          if (mx >= loc.x && mx <= loc.x + loc.w && my >= loc.y && my <= loc.y + loc.h) {
            activeMenu = null;
            changeRoom(loc.target, loc.spawnX, loc.spawnY);
            return;
          }
        }
        return;
      }

      if (activeMenu === 'weaponShop') {
        // Select item rows
        if (mx >= 95 && mx <= 545 && my >= 135 && my <= 210) {
          shopSelected = 0; // fox blade
          return;
        }
        if (mx >= 95 && mx <= 545 && my >= 215 && my <= 290) {
          shopSelected = 1; // neko claws
          return;
        }
        // Buy button
        if (mx >= 360 && mx <= 440 && my >= 310 && my <= 350) {
          const items = [
            { id: 'fox_sword', name: 'Fox Blade', price: 20 },
            { id: 'neko_claws', name: 'Neko Claws', price: 20 }
          ];
          const item = items[shopSelected] || items[0];
          if (inventory.indexOf(item.id) >= 0) {
            shopToast = 'You already own ' + item.name + '.';
            shopToastTimer = 120;
          } else if (playerGold < item.price) {
            shopToast = 'Not enough gold! (need ' + item.price + ')';
            shopToastTimer = 120;
          } else {
            playerGold -= item.price;
            inventory.push(item.id);
            shopToast = 'Purchased ' + item.name + '!';
            shopToastTimer = 120;
          }
          return;
        }
        // Cancel button
        if (mx >= 460 && mx <= 550 && my >= 310 && my <= 350) {
          activeMenu = null;
          shopToast = '';
          return;
        }
        // Click outside panel closes
        if (mx < 70 || mx > 570 || my < 60 || my > 400) {
          activeMenu = null;
          shopToast = '';
          return;
        }
        return;
      }

      if (activeMenu === 'clothingShop') {
        // Close button
        if (mx >= 460 && mx <= 550 && my >= 300 && my <= 340) {
          activeMenu = null;
          shopToast = '';
          return;
        }
        // Outside panel closes
        if (mx < 70 || mx > 570 || my < 70 || my > 380) {
          activeMenu = null;
          shopToast = '';
          return;
        }
        return;
      }

      // Whiskers van click on the roof → map
      if (currentRoom === 'garageTopFloor') {
        if (mx >= vanHitbox.x && mx <= vanHitbox.x + vanHitbox.w &&
            my >= vanHitbox.y && my <= vanHitbox.y + vanHitbox.h) {
          activeMenu = 'map';
          return;
        }
      }

      // Weapons merchant click
      if (currentRoom === 'weaponStore') {
        const n = weaponNpcHitbox;
        if (mx >= n.x && mx <= n.x + n.w && my >= n.y && my <= n.y + n.h) {
          activeMenu = 'weaponShop';
          shopSelected = 0;
          shopToast = '';
          return;
        }
      }

      // Clothing merchant click
      if (currentRoom === 'clothingStore') {
        const n = clothingNpcHitbox;
        if (mx >= n.x && mx <= n.x + n.w && my >= n.y && my <= n.y + n.h) {
          activeMenu = 'clothingShop';
          shopToast = '';
          return;
        }
      }

      // Warehouse training box → start turn-based fight
      if (currentRoom === 'warehouse') {
        const b = trainingBoxHitbox;
        if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) {
          startWarehouseBattle();
          return;
        }
      }

      // Combat menu (attack / defend) — blocked while anim plays
      if (currentRoom === 'warehouseBattle' && combat.active && !combat.won && !combat.anim) {
        // Attack button
        if (mx >= 160 && mx <= 300 && my >= 400 && my <= 450) {
          combatAttack();
          return;
        }
        // Defend button
        if (mx >= 340 && mx <= 480 && my >= 400 && my <= 450) {
          combatDefend();
          return;
        }
      }

      // Normal door clicks
      for (const d of rooms[currentRoom].doors) {
        if (mx >= d.x && mx <= d.x + d.w && my >= d.y && my <= d.y + d.h) {
          changeRoom(d.target, d.spawnX, d.spawnY);
          return;
        }
      }

      // No free walking while combat menu is up
      if (activeMenu === 'combat' && combat.active && !combat.won) return;

      // Walk to clicked position (keep feet in walkable band)
      const aw = frameW * ani.scale;
      const ah = frameH * ani.scale;
      ani.targetX = Math.min(Math.max(mx - aw / 2, -aw * 0.2), canvas.width - aw * 0.3);
      ani.targetY = Math.min(Math.max(my - ah * 0.75, 40), canvas.height - ah * 0.85);
    });

    function update() {
      if (shopToastTimer > 0) shopToastTimer--;

      // Advance combat attack/defend animation
      if (combat.anim) {
        combat.anim.timer++;
        if (combat.anim.timer >= COMBAT_FRAME_TICKS) {
          combat.anim.timer = 0;
          combat.anim.frame++;
          const maxF = combat.anim.maxFrames || COMBAT_FRAMES;
          if (combat.anim.frame >= maxF) {
            finishCombatAction();
          }
        }
      }

      // Freeze free walking during map/shop menus
      if (activeMenu && activeMenu !== 'combat') return;
      // During combat, park both girls just above the speech/combat bar (y≈370)
      if (activeMenu === 'combat' && combat.active && !combat.won) {
        // Feet sit on the floor strip above the menu; left half of screen
        const combatFeetY = 368;
        const aniDrawH = frameH * ani.scale * 0.95;
        const nekoDrawH = nekoFrameH * neko.scale * 0.95;
        // targetX/Y is top-left of walk sprite — convert from desired feet pos
        ani.targetX = 200 - (frameW * ani.scale * 0.95) / 2;
        ani.targetY = combatFeetY - aniDrawH;
        neko.targetX = 95 - (nekoFrameW * neko.scale * 0.95) / 2;
        neko.targetY = combatFeetY - nekoDrawH;
        if (!combat.anim) {
          ani.frame = IDLE_FRAME;
          neko.frame = NEKO_IDLE;
        }
      }

      const dx = ani.targetX - ani.x, dy = ani.targetY - ani.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist > 3) {
        ani.x += (dx / dist) * ani.speed;
        ani.y += (dy / dist) * ani.speed;
        if (dx > 0.5) ani.facing = 1;
        if (dx < -0.5) ani.facing = -1;
        ani.animTimer++;
        if (ani.animTimer > 12) {
          ani.animTimer = 0;
          ani.frame = (ani.frame === WALK_FRAMES[0]) ? WALK_FRAMES[1] : WALK_FRAMES[0];
        }
      } else {
        ani.frame = IDLE_FRAME;
        ani.x = ani.targetX; ani.y = ani.targetY;
      }

      const ndx = (ani.x - 85) - neko.x;
      const ndy = (ani.y + 8) - neko.y;
      const ndist = Math.sqrt(ndx*ndx + ndy*ndy);
      if (ndist > 35) {
        neko.x += (ndx / ndist) * neko.speed;
        neko.y += (ndy / ndist) * neko.speed;
        if (ndx > 0.5) neko.facing = 1;
        if (ndx < -0.5) neko.facing = -1;
        neko.animTimer++;
        if (neko.animTimer > 14) {
          neko.animTimer = 0;
          neko.frame = (neko.frame === NEKO_WALK[0]) ? NEKO_WALK[1] : NEKO_WALK[0];
        }
      } else {
        neko.frame = NEKO_IDLE;
      }
    }

    // ===== HELPERS =====
    function shadeColor(hex, amt) {
      const num = parseInt(hex.replace('#', ''), 16);
      let r = Math.max(0, Math.min(255, (num >> 16) + amt));
      let g = Math.max(0, Math.min(255, ((num >> 8) & 0xFF) + amt));
      let b = Math.max(0, Math.min(255, (num & 0xFF) + amt));
      return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
    }

    function drawDoor(x, y, w, h) {
      ctx.fillStyle = '#3d2914'; ctx.fillRect(x-5, y-5, w+10, h+10);
      ctx.fillStyle = '#8B4513'; ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = '#5c3317'; ctx.lineWidth = 2;
      ctx.strokeRect(x+8, y+10, w-16, h/2-16);
      ctx.strokeRect(x+8, y+h/2+6, w-16, h/2-18);
      ctx.fillStyle = '#d4af37';
      ctx.beginPath(); ctx.arc(x+w-14, y+h/2, 6, 0, Math.PI*2); ctx.fill();
    }

    function drawShopDoor(doorX, doorY, frameColor) {
      ctx.fillStyle = frameColor; ctx.fillRect(doorX, doorY, 50, 70);
      ctx.fillStyle = shadeColor(frameColor, -15); ctx.fillRect(doorX+4, doorY+4, 42, 62);
      ctx.fillStyle = '#e8d97a';
      ctx.beginPath(); ctx.arc(doorX+38, doorY+35, 3, 0, Math.PI*2); ctx.fill();
    }

    function drawStreetSign(x, y, text) {
      ctx.fillStyle = '#2a2218';
      ctx.fillRect(x - 4, y - 4, 98, 36);
      ctx.fillStyle = '#3d3226';
      ctx.fillRect(x, y, 90, 28);
      ctx.strokeStyle = '#e8c94a';
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, 90, 28);
      ctx.fillStyle = '#2a2218';
      ctx.fillRect(x + 40, y + 28, 10, 12);
      ctx.fillStyle = '#e8c94a';
      ctx.font = 'bold 12px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText(text, x + 45, y + 19);
      ctx.textAlign = 'left';
    }

    // Sign + glowing zone drawn ON the door hitbox so the click target is obvious
    // prop: null | 'bike' | 'bench' — fills the lower part of the hitbox
    function drawTravelMarker(x, y, w, h, text, prop) {
      // Soft gold pad over the whole clickable area
      ctx.fillStyle = 'rgba(232, 201, 74, 0.14)';
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = 'rgba(232, 201, 74, 0.75)';
      ctx.lineWidth = 2;
      ctx.setLineDash([7, 5]);
      ctx.strokeRect(x + 3, y + 3, w - 6, h - 6);
      ctx.setLineDash([]);

      // Sign centered near top of the hotspot
      const signW = 90;
      const sx = Math.floor(x + (w - signW) / 2);
      const sy = Math.floor(y + 8);
      drawStreetSign(sx, sy, text);

      // Prop fills the bottom of the hitbox (makes the exit feel solid / clickable)
      const groundY = y + h - 6;
      if (prop === 'bike') {
        drawBike(x + Math.floor((w - 62) / 2), groundY);
      } else if (prop === 'bench') {
        drawParkBench(x + 8, groundY, w - 16);
      }
    }

    // Street bike — sits under the GARAGE sign, fills the exit hitbox
    function drawBike(x, groundY) {
      // soft shadow
      ctx.fillStyle = 'rgba(0,0,0,0.28)';
      ctx.beginPath();
      ctx.ellipse(x + 30, groundY + 2, 28, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      // wheels
      ctx.strokeStyle = '#1a1a1a';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(x + 12, groundY - 2, 12, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(x + 50, groundY - 2, 12, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = '#6a6a62';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(x + 12, groundY - 2, 6, 0, Math.PI * 2); ctx.stroke();

    // ===== EXTERIOR SHOPS =====
    // Draw image into a rect with cover-crop (preserve aspect, fill box)
    function drawImageCover(img, dx, dy, dw, dh, focusX, focusY) {
      if (!img || !img.complete || !img.naturalWidth) return false;
      const iw = img.naturalWidth, ih = img.naturalHeight;
      const ir = iw / ih, tr = dw / dh;
      let sx, sy, sw, sh;
      if (ir > tr) {
        sh = ih;
        sw = sh * tr;
        const fx = focusX == null ? 0.5 : focusX;
        sx = Math.max(0, Math.min(iw - sw, iw * fx - sw / 2));
        sy = 0;
      } else {
        sw = iw;
        sh = sw / tr;
        const fy = focusY == null ? 0.5 : focusY;
        sx = 0;
        sy = Math.max(0, Math.min(ih - sh, ih * fy - sh / 2));
      }
      ctx.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh);
      return true;
    }

    // ===== BROKEN BUILDING + GARAGE =====
    function drawBrokenBuilding(x, groundY, w, h) {
      const y = groundY - h;
      ctx.fillStyle = '#6b6558'; ctx.fillRect(x, y, w, h);
      ctx.fillStyle = 'rgba(40,38,32,0.25)';
      for (let i = 0; i < 4; i++) {
        const sx = x + 10 + i * (w / 4);
        ctx.fillRect(sx, y, 6, h * (0.4 + (i%3)*0.15));
      }
      ctx.fillStyle = shadeColor('#6b6558', -25);
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + w*0.2, y-10);
      ctx.lineTo(x + w*0.35, y);
      ctx.lineTo(x + w*0.55, y-14);
      ctx.lineTo(x + w*0.7, y);
      ctx.lineTo(x + w*0.9, y-6);
      ctx.lineTo(x + w, y);
      ctx.closePath(); ctx.fill();

      const winW = 16, winH = 20, padX = 14, padY = 18;
      let boardToggle = 0;
      for (let wy = y + padY + 8; wy < y + h - winH; wy += winH + padY) {
        for (let wx = x + padX; wx < x + w - winW; wx += winW + padX) {
          if (boardToggle % 3 === 0) {
            ctx.fillStyle = '#3d3226'; ctx.fillRect(wx, wy, winW, winH);
            ctx.strokeStyle = '#8a6a3a'; ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(wx, wy); ctx.lineTo(wx+winW, wy+winH);
            ctx.moveTo(wx+winW, wy); ctx.lineTo(wx, wy+winH);
            ctx.stroke();
          } else {
            ctx.fillStyle = '#1a1a1a'; ctx.fillRect(wx, wy, winW, winH);
            ctx.strokeStyle = '#0a0a0a'; ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(wx + winW*0.3, wy);
            ctx.lineTo(wx + winW*0.5, wy + winH*0.5);
            ctx.lineTo(wx + winW*0.2, wy + winH);
            ctx.stroke();
          }
          boardToggle++;
        }
      }
      ctx.fillStyle = '#5a5548';
      ctx.beginPath(); ctx.ellipse(x + w*0.15, groundY, 20, 7, 0, 0, Math.PI*2); ctx.fill();
    }

    function drawParkingGarage(x, groundY, w, h) {
      const y = groundY - h;
      ctx.fillStyle = '#8a8a82'; ctx.fillRect(x, y, w, h);
      ctx.fillStyle = shadeColor('#8a8a82', -20); ctx.fillRect(x, y, w, 10);

      const levels = 3;
      const levelH = (h - 10) / levels;
      ctx.strokeStyle = '#5a5a52'; ctx.lineWidth = 4;
      for (let i = 1; i < levels; i++) {
        ctx.beginPath();
        ctx.moveTo(x, y + 10 + levelH * i);
        ctx.lineTo(x + w, y + 10 + levelH * i);
        ctx.stroke();
      }

      ctx.fillStyle = '#3a3a36';
      for (let lvl = 0; lvl < levels; lvl++) {
        const ly = y + 10 + levelH * lvl + 8;
        const openH = levelH - 16;
        const colCount = 4;
        const colW = (w - 20) / colCount - 8;
        for (let c = 0; c < colCount; c++) {
          const cx = x + 10 + c * ((w - 20) / colCount);
          ctx.fillRect(cx, ly, colW, openH);
        }
      }

      ctx.fillStyle = '#2a2a26'; ctx.fillRect(x + w/2 - 55, y - 22, 110, 18);
      ctx.fillStyle = '#e8c94a'; ctx.font = 'bold 12px Courier New'; ctx.textAlign = 'center';

      ctx.fillStyle = '#1a1a1a'; ctx.fillRect(x + w - 85, groundY - 80, 75, 80);

      ctx.strokeRect(x + w - 85, groundY - 80, 75, 80);
      ctx.fillStyle = '#e8c94a'; ctx.fillRect(x + w - 85, groundY - 6, 75, 6);
    }

    // Draw car from the car_sheet.png (0=red Flare, 1=black Shadow, 2=van)
    // Source rects measured from car_sheet.png top-row 3/4 views (full vehicles, no side/ortho cuts)
    function drawCarSprite(x, groundY, which, scale) {
      if (!carSheet.complete || carSheet.naturalWidth === 0) return;

      const srcs = [
        { sx: 50,  sy: 120, sw: 410, sh: 255 }, // red Flare Civic
        { sx: 490, sy: 170, sw: 390, sh: 245 }, // black Shadow GT-R
        { sx: 900, sy: 70,  sw: 420, sh: 340 }  // Whiskers van (ears + roof rack)
      ];
      const s = srcs[which] || srcs[0];
      // Clamp to sheet bounds so crops never spill into neighboring art
      const maxW = carSheet.naturalWidth;
      const maxH = carSheet.naturalHeight;
      const sx = Math.max(0, Math.min(s.sx, maxW - 1));
      const sy = Math.max(0, Math.min(s.sy, maxH - 1));
      const sw = Math.min(s.sw, maxW - sx);
      const sh = Math.min(s.sh, maxH - sy);

      const dw = sw * scale;
      const dh = sh * scale;

      // soft shadow under tires
      ctx.fillStyle = 'rgba(0,0,0,0.32)';
      ctx.beginPath();
      ctx.ellipse(x + dw * 0.48, groundY + 4, dw * 0.42, 9, 0, 0, Math.PI * 2);
      ctx.fill();

      // Align bottom of sprite to ground (small lift so tires sit on the pavement)
      ctx.drawImage(carSheet, sx, sy, sw, sh, x, groundY - dh + 8, dw, dh);
    }

    // ===== LEVEL 2 HELPERS =====
    function drawBigPillar(x, y, h) {
      const w = 70;
      ctx.fillStyle = '#606058';
      ctx.fillRect(x, y, w, h);
      ctx.fillStyle = 'rgba(20,20,15,0.3)';
      ctx.fillRect(x, y, 14, h);
      ctx.fillRect(x + w - 14, y, 14, h);
      ctx.strokeStyle = 'rgba(20,20,15,0.2)';
      ctx.lineWidth = 2;
      for (let by = y + 30; by < y + h; by += 60) {
        ctx.beginPath();
        ctx.moveTo(x, by);
        ctx.lineTo(x + w, by);
        ctx.stroke();
      }
      ctx.fillStyle = '#4a4a42';
      ctx.beginPath();
      ctx.moveTo(x + 10, y + h);
      ctx.lineTo(x + 22, y + h - 22);
      ctx.lineTo(x + 34, y + h);
      ctx.closePath();

    function drawFaceDecal(cx, cy, color, type) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(cx, cy, 16, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      if (type === 'fox') {
        ctx.moveTo(cx - 14, cy - 10);
        ctx.lineTo(cx - 20, cy - 24);
        ctx.lineTo(cx - 6, cy - 16);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(cx + 14, cy - 10);
        ctx.lineTo(cx + 20, cy - 24);
        ctx.lineTo(cx + 6, cy - 16);
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.moveTo(cx - 12, cy - 12);
        ctx.lineTo(cx - 16, cy - 22);
        ctx.lineTo(cx - 4, cy - 16);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(cx + 12, cy - 12);
        ctx.lineTo(cx + 16, cy - 22);
        ctx.lineTo(cx + 4, cy - 16);
        ctx.closePath();
        ctx.fill();
      }

      ctx.fillStyle = '#1a1a1a';
      ctx.beginPath(); ctx.arc(cx - 6, cy - 2, 2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + 6, cy - 2, 2, 0, Math.PI * 2); ctx.fill();

      ctx.beginPath();
      ctx.moveTo(cx - 3, cy + 4);
      ctx.lineTo(cx + 3, cy + 4);
      ctx.lineTo(cx, cy + 8);
      ctx.closePath();
      ctx.fill();
    }

    function drawForestEntrance() {
      const W = canvas.width, H = canvas.height;

      // Sky through canopy
      const sky = ctx.createLinearGradient(0, 0, 0, H);
      sky.addColorStop(0, '#1a2a28');
      sky.addColorStop(0.45, '#2a4a38');
      sky.addColorStop(1, '#0e1a14');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, W, H);

      // Soft fog
      ctx.fillStyle = 'rgba(80,120,90,0.12)';
      for (let i = 0; i < 6; i++) {
        ctx.beginPath();
        ctx.ellipse(80 + i * 100, 200 + (i % 3) * 40, 90, 30, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // Ground path hub
      ctx.fillStyle = '#3a3020';
      ctx.beginPath();
      ctx.ellipse(W / 2, H * 0.72, 220, 70, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#4a3a28';
      ctx.beginPath();
      ctx.ellipse(W / 2, H * 0.72, 160, 40, 0, 0, Math.PI * 2);
      ctx.fill();

      // Trees framing the crossroads
      function tree(x, baseY, h) {
        ctx.fillStyle = '#2a1a10';
        ctx.fillRect(x - 8, baseY - h * 0.35, 16, h * 0.35);
        ctx.fillStyle = '#1a3a28';
        ctx.beginPath();
        ctx.moveTo(x, baseY - h);
        ctx.lineTo(x + h * 0.28, baseY - h * 0.35);
        ctx.lineTo(x - h * 0.28, baseY - h * 0.35);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#245038';
        ctx.beginPath();
        ctx.moveTo(x, baseY - h * 0.85);
        ctx.lineTo(x + h * 0.22, baseY - h * 0.4);
        ctx.lineTo(x - h * 0.22, baseY - h * 0.4);
        ctx.closePath();
        ctx.fill();
      }
      tree(50, H * 0.75, 220);
      tree(110, H * 0.78, 180);
      tree(590, H * 0.75, 230);
      tree(530, H * 0.78, 190);
      tree(200, H * 0.55, 160);
      tree(440, H * 0.52, 170);

      // Firefly dots
      ctx.fillStyle = 'rgba(180,255,140,0.55)';
      for (let i = 0; i < 18; i++) {
        const fx = 40 + ((i * 97) % 560);
        const fy = 40 + ((i * 53) % 280);
        ctx.beginPath();
        ctx.arc(fx, fy, 2 + (i % 3), 0, Math.PI * 2);
        ctx.fill();
      }

      // Title
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fillRect(W / 2 - 150, 12, 300, 36);
      ctx.fillStyle = '#9dffc0';
      ctx.font = 'bold 16px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText('Whispering Forest Crossroads', W / 2, 36);

      // 5 path mouths (match door hitboxes)
      const paths = [
        { x: 40, y: 120, label: 'Moss Trail', color: '#3a6a48' },
        { x: 160, y: 90, label: 'Firefly Creek', color: '#2a5a6a' },
        { x: 280, y: 70, label: 'Ancient Grove', color: '#4a5a30' },
        { x: 400, y: 90, label: 'Mushroom Hollow', color: '#5a4a6a' },
        { x: 520, y: 120, label: 'Deep Thicket', color: '#1a3a28' }
      ];
      for (let i = 0; i < paths.length; i++) {
        const p = paths[i];
        // path corridor into trees
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.moveTo(p.x + 10, p.y + 80);
        ctx.lineTo(p.x + 40, p.y);
        ctx.lineTo(p.x + 60, p.y);
        ctx.lineTo(p.x + 90, p.y + 80);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = 'rgba(125,255,176,0.75)';
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 4]);
        ctx.strokeRect(p.x, p.y, 100, 80);
        ctx.setLineDash([]);
        ctx.fillStyle = 'rgba(0,0,0,0.45)';
        ctx.fillRect(p.x + 6, p.y + 8, 88, 28);
        ctx.fillStyle = '#cfe';
        ctx.font = 'bold 11px Courier New';
        ctx.fillText(p.label, p.x + 50, p.y + 22);
        ctx.fillStyle = 'rgba(232,201,74,0.8)';
        ctx.font = '10px Courier New';
        ctx.fillText('enter →', p.x + 50, p.y + 42);
      }

      ctx.textAlign = 'left';
      drawForestExitPad();
      ctx.fillStyle = '#7dffb0';
      ctx.font = 'bold 12px Courier New';
      ctx.fillText('◄ Roof', 32, 358);

    function drawForestPath(variant) {
      const W = canvas.width, H = canvas.height;
      const palettes = [
        { sky0: '#1a3028', sky1: '#0a1810', ground: '#2a3a28', accent: '#6dff9a', name: 'Moss' },
        { sky0: '#1a2838', sky1: '#0a1218', ground: '#243038', accent: '#80e0ff', name: 'Creek' },
        { sky0: '#243018', sky1: '#101808', ground: '#3a3a20', accent: '#c8e060', name: 'Grove' },
        { sky0: '#2a2038', sky1: '#120e18', ground: '#2a2430', accent: '#e0a0ff', name: 'Hollow' },
        { sky0: '#0e1a14', sky1: '#060c08', ground: '#1a2418', accent: '#50a070', name: 'Thicket' }
      ];
      const p = palettes[variant] || palettes[0];

      const sky = ctx.createLinearGradient(0, 0, 0, H);
      sky.addColorStop(0, p.sky0);
      sky.addColorStop(1, p.sky1);
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, W, H);

      // Tree trunks
      for (let i = 0; i < 8; i++) {
        const tx = 30 + i * 80 + (i % 2) * 20;
        ctx.fillStyle = '#1a1208';
        ctx.fillRect(tx, 40, 18 + (i % 3) * 4, H * 0.7);
        ctx.fillStyle = p.sky0;
        ctx.beginPath();
        ctx.arc(tx + 10, 80 + (i % 4) * 30, 40 + (i % 3) * 10, 0, Math.PI * 2);
        ctx.fill();
      }

      // Path
      ctx.fillStyle = p.ground;
      ctx.beginPath();
      ctx.moveTo(W * 0.25, H);
      ctx.lineTo(W * 0.4, H * 0.55);
      ctx.lineTo(W * 0.6, H * 0.55);
      ctx.lineTo(W * 0.75, H);
      ctx.closePath();
      ctx.fill();

      // Accents
      ctx.fillStyle = p.accent;
      ctx.globalAlpha = 0.35;
      for (let i = 0; i < 12; i++) {
        ctx.beginPath();
        ctx.arc(60 + i * 50, 100 + (i % 5) * 40, 3, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fillRect(W / 2 - 120, 16, 240, 32);
      ctx.fillStyle = p.accent;
      ctx.font = 'bold 14px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText(rooms[currentRoom].name, W / 2, 38);
      ctx.textAlign = 'left';

      drawForestExitPad();
      ctx.fillStyle = '#7dffb0';
      ctx.font = 'bold 12px Courier New';
      ctx.fillText('◄ Crossroads', 18, 358);
    }

    function drawDreamcore() {
      const W = canvas.width, H = canvas.height;

      // Surreal gradient sky
      const sky = ctx.createLinearGradient(0, 0, W, H);
      sky.addColorStop(0, '#1a1040');
      sky.addColorStop(0.4, '#3a2060');
      sky.addColorStop(0.7, '#e080c0');
      sky.addColorStop(1, '#80c0e8');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, W, H);

      // Checker floor fading into void
      const tile = 40;
      for (let y = Math.floor(H * 0.55); y < H; y += tile) {
        for (let x = 0; x < W; x += tile) {
          const fade = (y - H * 0.55) / (H * 0.45);
          const on = ((x / tile) + (y / tile)) % 2 === 0;
          ctx.fillStyle = on
            ? 'rgba(255,255,255,' + (0.15 + fade * 0.25) + ')'
            : 'rgba(40,20,60,' + (0.35 + fade * 0.4) + ')';
          ctx.fillRect(x, y, tile, tile);
        }
      }

      // Floating islands / blobs
      ctx.fillStyle = 'rgba(200,160,255,0.35)';
      ctx.beginPath(); ctx.ellipse(120, 140, 70, 28, -0.3, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(500, 100, 90, 34, 0.2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,180,220,0.3)';
      ctx.beginPath(); ctx.ellipse(320, 180, 100, 26, 0, 0, Math.PI * 2); ctx.fill();

      // Giant moon / orb
      const orb = ctx.createRadialGradient(480, 80, 10, 480, 80, 90);
      orb.addColorStop(0, 'rgba(255,255,255,0.9)');
      orb.addColorStop(0.4, 'rgba(200,180,255,0.5)');
      orb.addColorStop(1, 'rgba(100,60,160,0)');
      ctx.fillStyle = orb;
      ctx.beginPath();
      ctx.arc(480, 80, 90, 0, Math.PI * 2);
      ctx.fill();

      // Doorways that go nowhere (dream vibe)
      ctx.fillStyle = 'rgba(20,10,40,0.7)';
      ctx.fillRect(80, 220, 50, 90);
      ctx.fillRect(520, 200, 50, 100);
      ctx.strokeStyle = 'rgba(200,160,255,0.6)';
      ctx.lineWidth = 2;
      ctx.strokeRect(80, 220, 50, 90);
      ctx.strokeRect(520, 200, 50, 100);

      // Title
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(W / 2 - 110, 14, 220, 34);
      ctx.fillStyle = '#e0c0ff';
      ctx.font = 'bold 16px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText('Dreamcore Limbo', W / 2, 38);
      ctx.font = '11px Courier New';
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.fillText('time feels soft here…', W / 2, 70);
      ctx.textAlign = 'left';

      drawForestExitPad();
      ctx.fillStyle = '#c9a0ff';
      ctx.font = 'bold 12px Courier New';
      ctx.fillText('◄ Roof', 32, 358);
    }

    function drawCity() {

      // focusY ~0.5 keeps sidewalk band under the storefronts
      const drawn = drawImageCover(streetRoadArt, 0, 0, W, H, 0.5, 0.5);

        const groundY = H * 0.55;

        ctx.fillStyle = '#3a3a42'; ctx.fillRect(0, H * 0.78, W, H * 0.22);
      }

      // Sidewalk top edge in the street art (~58% of frame when height-mapped)
      // Shop bottoms sit ON that sidewalk so facades line up with the walkway
      const sidewalkY = H * 0.58;
      const shopH = H * 0.40;

      // Soft shadow strip so shops feel planted on the pavement
      ctx.fillStyle = 'rgba(0,0,0,0.22)';
      ctx.fillRect(20, sidewalkY - 4, 540, 10);

      // Home house facade behind the ◄ Home door (left of shops)
      const homeW = 110;

      const homeX = 15;
      const homeY = sidewalkY - homeH;

        ctx.strokeStyle = 'rgba(80, 255, 140, 0.55)';
        ctx.lineWidth = 2;
        ctx.strokeRect(homeX + 1, homeY + 1, homeW - 2, homeH - 2);

        ctx.fillRect(homeX + 6, homeY + 6, homeW - 12, 18);

        ctx.font = 'bold 11px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('◄ HOME', homeX + homeW / 2, homeY + 19);
        ctx.textAlign = 'left';

      // Storefronts lined up along the sidewalk (after the house)
      drawWeaponStore(140, sidewalkY, 150, shopH);
      drawClothingStore(300, sidewalkY, 145, shopH * 0.95);

    function drawWarehouseBase(battleMode) {

      ctx.strokeStyle = 'rgba(20,20,18,0.35)';

        ctx.lineTo(wx + 35, 70);

        ctx.lineTo(wx + 70, 50);

    function drawTrainingDummy(cx, groundY) {
      // post

      ctx.fillStyle = '#8a6a4a';

      ctx.fillStyle = '#6a4a30';
      ctx.beginPath();
      ctx.ellipse(cx, groundY - 100, 14, 28, 0, 0, Math.PI * 2);

      ctx.fillStyle = '#c4a070';
      ctx.beginPath();
      ctx.arc(cx, groundY - 145, 16, 0, Math.PI * 2);
      ctx.fill();
      // X face
      ctx.strokeStyle = '#3a2a1a';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx - 6, groundY - 150);
      ctx.lineTo(cx + 6, groundY - 140);
      ctx.moveTo(cx + 6, groundY - 150);

      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(cx - 30, groundY - 110);

      ctx.fillRect(cx - 22, groundY - 8, 44, 10);

    // Draw merchant at roughly Ani's on-screen size
    function drawWeaponMerchant() {
      const feetX = weaponNpcPos.feetX;
      const feetY = weaponNpcPos.feetY;
      // Match fox girl's drawn height
      const aniDrawH = frameH * ani.scale;

      if (!weaponPersonArt.complete || !weaponPersonArt.naturalWidth) {
        const fw = 50, fh = aniDrawH;
        weaponNpcHitbox.x = feetX - fw / 2;
        weaponNpcHitbox.y = feetY - fh;
        weaponNpcHitbox.w = fw;
        weaponNpcHitbox.h = fh;
        ctx.fillStyle = 'rgba(40,30,25,0.8)';
        ctx.fillRect(weaponNpcHitbox.x, weaponNpcHitbox.y, fw, fh);
        return;
      }

      const iw = weaponPersonArt.naturalWidth;
      const ih = weaponPersonArt.naturalHeight;
      const scale = aniDrawH / ih;
      const dw = iw * scale;
      const dh = ih * scale;
      const dx = feetX - dw / 2;
      const dy = feetY - dh;

      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath();
      ctx.ellipse(feetX, feetY - 2, dw * 0.28, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.drawImage(weaponPersonArt, dx, dy, dw, dh);

      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      const label = 'Shopkeep';
      ctx.font = 'bold 11px Courier New';
      const tw = ctx.measureText(label).width;
      ctx.fillRect(feetX - tw / 2 - 6, dy - 22, tw + 12, 18);
      ctx.fillStyle = '#7dffb0';
      ctx.textAlign = 'center';
      ctx.fillText(label, feetX, dy - 9);
      ctx.textAlign = 'left';

      weaponNpcHitbox.x = dx;
      weaponNpcHitbox.y = dy;
      weaponNpcHitbox.w = dw;
      weaponNpcHitbox.h = dh;
    }

        const sc = Math.min((w - 8) / img.naturalWidth, (h - 8) / img.naturalHeight);

        ctx.drawImage(img, x + (w - sw) / 2, y + (h - sh) / 2, sw, sh);

      const feetX = clothingNpcPos.feetX;
      const feetY = clothingNpcPos.feetY;
      const aniDrawH = frameH * ani.scale;

      if (!clothingPersonArt.complete || !clothingPersonArt.naturalWidth) {
        clothingNpcHitbox.x = feetX - 40;
        clothingNpcHitbox.y = feetY - aniDrawH;
        clothingNpcHitbox.w = 80;
        clothingNpcHitbox.h = aniDrawH;
        ctx.fillStyle = 'rgba(80,40,70,0.8)';
        ctx.fillRect(clothingNpcHitbox.x, clothingNpcHitbox.y, 80, aniDrawH);
        return;
      }

      const iw = clothingPersonArt.naturalWidth;
      const ih = clothingPersonArt.naturalHeight;
      const scale = aniDrawH / ih;
      const dw = iw * scale;
      const dh = ih * scale;
      const dx = feetX - dw / 2;
      const dy = feetY - dh;

      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath();
      ctx.ellipse(feetX, feetY - 2, dw * 0.28, 8, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.drawImage(clothingPersonArt, dx, dy, dw, dh);

      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.font = 'bold 11px Courier New';
      const label = 'Shopkeep';
      const tw = ctx.measureText(label).width;
      ctx.fillRect(feetX - tw / 2 - 6, dy - 22, tw + 12, 18);
      ctx.fillStyle = '#e8a0d0';
      ctx.textAlign = 'center';
      ctx.fillText(label, feetX, dy - 9);
      ctx.textAlign = 'left';

      clothingNpcHitbox.x = dx;
      clothingNpcHitbox.y = dy;
      clothingNpcHitbox.w = dw;
      clothingNpcHitbox.h = dh;
    }

    function drawClothingStoreInterior() {
      const W = canvas.width, H = canvas.height;
      // Full-room clothing / attire concept art
      const drawn = drawImageCover(clothingInt, 0, 0, W, H, 0.5, 0.55);
      if (!drawn) {
        ctx.fillStyle = '#c48fae'; ctx.fillRect(0, 0, W, H * 0.75);
        ctx.fillStyle = '#e8d9c9'; ctx.fillRect(0, H * 0.75, W, H * 0.25);
        drawClothingRack(60, H * 0.2, 220);
        drawClothingRack(340, H * 0.2, 220);
        drawCounter(W - 260, H * 0.55, 200, 90, '#7a4a5a');
      }

      drawClothingMerchant();

      // Exit pad bottom-left
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(15, 360, 90, 90);
      ctx.strokeStyle = 'rgba(125, 255, 176, 0.8)';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 4]);
      ctx.strokeRect(18, 363, 84, 84);
      ctx.setLineDash([]);
      drawShopDoor(35, 370, '#2a2a26');
      ctx.fillStyle = '#7dffb0';
      ctx.font = 'bold 12px Courier New';
      ctx.fillText('◄ Street', 28, 358);
    }

    function drawBarInterior() {
      const W = canvas.width, H = canvas.height;
      // Full-room tavern concept art — The Eldritch Tap
      const drawn = drawImageCover(barInt, 0, 0, W, H, 0.55, 0.5);
      if (!drawn) {
        ctx.fillStyle = '#3a2a20'; ctx.fillRect(0, 0, W, H * 0.75);
        ctx.fillStyle = '#4a3a2a'; ctx.fillRect(0, H * 0.75, W, H * 0.25);
        drawCounter(W - 260, H * 0.5, 200, 100, '#2a1f18');
        drawBottleShelf(W - 250, H * 0.18, 180);
      }

      // Exit pad bottom-left
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(15, 360, 90, 90);
      ctx.strokeStyle = 'rgba(125, 255, 176, 0.8)';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 4]);
      ctx.strokeRect(18, 363, 84, 84);
      ctx.setLineDash([]);
      drawShopDoor(35, 370, '#2a2a26');
      ctx.fillStyle = '#7dffb0';
      ctx.font = 'bold 12px Courier New';
      ctx.fillText('◄ Street', 28, 358);
    }

    function draw() {
      if (currentRoom === 'room') drawRoom();
      else if (currentRoom === 'hallway') drawHallway();
      else if (currentRoom === 'kitchen') drawKitchen();
      else if (currentRoom === 'outside') drawCity();
      else if (currentRoom === 'garageStreet') drawGarageStreet();
      else if (currentRoom === 'warehouse') drawWarehouse();
      else if (currentRoom === 'warehouseBattle') drawWarehouseBattle();
      else if (currentRoom === 'parkingGarage') drawParkingGarageInterior();
      else if (currentRoom === 'stairwell') drawStairwellInterior();
      else if (currentRoom === 'parkingGarageLevel2') drawParkingGarageLevel2();
      else if (currentRoom === 'parkingGarageLevel3') drawParkingGarageLevel3();
      else if (currentRoom === 'parkingGarageLevel4') drawParkingGarageLevel4();
      else if (currentRoom === 'garageTopFloor') drawGarageTopFloor();
      else if (currentRoom === 'forestEntrance') drawForestEntrance();
      else if (currentRoom === 'forestPath1') drawForestPath(0);
      else if (currentRoom === 'forestPath2') drawForestPath(1);
      else if (currentRoom === 'forestPath3') drawForestPath(2);
      else if (currentRoom === 'forestPath4') drawForestPath(3);
      else if (currentRoom === 'forestPath5') drawForestPath(4);
      else if (currentRoom === 'dreamcore') drawDreamcore();
      else if (currentRoom === 'weaponStore') drawWeaponStoreInterior();
      else if (currentRoom === 'clothingStore') drawClothingStoreInterior();
      else if (currentRoom === 'bar') drawBarInterior();

      // Draw fighters — combat sheets in warehouse battle, walk sheets elsewhere
      if (currentRoom === 'warehouseBattle' && combat.active) {
        // Pin feet just above the combat speech bar (panel starts at y=370)
        const combatFeetY = 368;
        drawCombatFighter('ani', 200, combatFeetY);
        drawCombatFighter('neko', 95, combatFeetY);
      } else {
        // Draw Ani
        const drawW = frameW * ani.scale, drawH = frameH * ani.scale;
        ctx.fillStyle = 'rgba(0,0,0,0.28)';
        ctx.beginPath();
        ctx.ellipse(ani.x + drawW / 2, ani.y + drawH - 6, drawW * 0.30, 10, 0, 0, Math.PI * 2);
        ctx.fill();

        const clean = getCleanFrame(ani.frame);
        if (clean) {
          ctx.save();
          if (ani.facing === -1) {
            ctx.translate(ani.x + drawW, ani.y); ctx.scale(-1, 1);
            ctx.drawImage(clean, 0, 0, frameW, frameH, 0, 0, drawW, drawH);
          } else {
            ctx.drawImage(clean, 0, 0, frameW, frameH, ani.x, ani.y, drawW, drawH);
          }
          ctx.restore();
        } else {
          ctx.fillStyle = '#ff8800';
          ctx.fillRect(ani.x + drawW * 0.3, ani.y + drawH * 0.2, drawW * 0.4, drawH * 0.7);
          ctx.beginPath();
          ctx.arc(ani.x + drawW * 0.5, ani.y + drawH * 0.18, drawW * 0.18, 0, Math.PI * 2);
          ctx.fill();
        }

        // Draw Neko — short-hair walk sheet only
        const nFeetX = neko.x + (nekoFrameW * neko.scale) / 2;
        const nFeetY = neko.y + nekoFrameH * neko.scale;
        drawNekoShortHair(nFeetX, nFeetY, neko.frame, 1);
      }

      // Gold / inventory HUD
      drawGoldHud();

      // Draw menu on top if open
      if (activeMenu === 'map') {
        drawMapMenu();
      } else if (activeMenu === 'weaponShop') {
        drawWeaponShopMenu();
      } else if (activeMenu === 'clothingShop') {
        drawClothingShopMenu();
      }
    }

    function loop() {
      try {
        update();
        draw();
      } catch (err) {
        console.error('Frame error:', err);
      }
      requestAnimationFrame(loop);
    }
  </script>
</body>
</html>
