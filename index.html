    function draw() {
      // Clear each frame so a failed mid-draw never leaves a ghost/blank state
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (currentRoom === 'room') drawRoom();
      else if (currentRoom === 'hallway') drawHallway();
      else if (currentRoom === 'kitchen') drawKitchen();
      else if (currentRoom === 'outside') drawCity();
      else if (currentRoom === 'garageStreet') drawGarageStreet();
      else if (currentRoom === 'warehouse') drawWarehouse();
      else if (currentRoom === 'warehouseBattle') drawWarehouseBattle();
      else if (currentRoom === 'forestBattle') drawForestBattleScene();
      else if (currentRoom === 'parkingGarage') drawParkingGarageInterior();
      else if (currentRoom === 'stairwell') drawStairwellInterior();
      else if (currentRoom === 'parkingGarageLevel2') drawParkingGarageLevel2();
      else if (currentRoom === 'parkingGarageLevel3') drawParkingGarageLevel3();
      else if (currentRoom === 'parkingGarageLevel4') drawParkingGarageLevel4();
      else if (currentRoom === 'garageTopFloor') drawGarageTopFloor();
      else if (currentRoom === 'forestEntrance') drawForestEntrance();
      else if (currentRoom === 'forestPath1') drawMossTrailCabin();
      else if (currentRoom === 'cabinInterior') drawCabinInteriorScene();
      else if (currentRoom === 'forestPath2') drawOpenGrassland();
      else if (currentRoom === 'roadFork') drawRoadForkScene();
      else if (currentRoom === 'forestCamp') drawForestCampScene();
      else if (currentRoom === 'banditFort') drawBanditFortScene();
      else if (currentRoom === 'forestPath3') drawAncientGroveCabin();
      else if (currentRoom === 'forestPath4') drawMushroomHollow();
      else if (currentRoom === 'mushroomPond') drawMushroomPondScene();
      else if (currentRoom === 'forestPath5') drawDeepThicketScene();
      else if (currentRoom === 'forestCave') drawForestCaveScene();
      else if (currentRoom === 'dreamcore') drawDreamcore();
      else if (currentRoom === 'weaponStore') drawWeaponStoreInterior();
      else if (currentRoom === 'clothingStore') drawClothingStoreInterior();
      else if (currentRoom === 'bar') drawBarInterior();

      // Draw fighters — combat sheets in battle, walk sheets elsewhere
      const inCombatDraw = combat.active && (
        currentRoom === 'warehouseBattle' ||
        currentRoom === 'forestBattle' ||
        combat.mode === 'forest'
      );
      if (inCombatDraw) {
        if (combat.mode === 'forest' && combat.partyFeet) {
          // Even layout on grass arena
          if (partyStats.ani.hp > 0) {
            drawCombatFighter('ani', combat.partyFeet.ani.x, combat.partyFeet.ani.y);
          }
          if (partyStats.neko.hp > 0) {
            drawCombatFighter('neko', combat.partyFeet.neko.x, combat.partyFeet.neko.y);
          }
          drawForestEnemies();
          drawCombatMenu();
        } else {
          // Warehouse training lineup
          const combatFeetY = 368;
          if (partyStats.ani.hp > 0 || combat.mode === 'training') {
            drawCombatFighter('ani', 175, combatFeetY);
          }
          if (partyStats.neko.hp > 0 || combat.mode === 'training') {
            drawCombatFighter('neko', 70, combatFeetY);
          }
        }
      } else {
        // Draw Ani
        const drawW = frameW * ani.scale, drawH = frameH * ani.scale;
        ctx.fillStyle = 'rgba(0,0,0,0.28)';
        ctx.beginPath();
        ctx.ellipse(ani.x + drawW / 2, ani.y + drawH - 6, drawW * 0.30, 10, 0, 0, Math.PI * 2);
        ctx.fill();

        const clean = getCleanFrame(ani.frame);
        if (clean) {
          ctx.save();
          if (ani.facing === -1) {
            ctx.translate(ani.x + drawW, ani.y); ctx.scale(-1, 1);
            ctx.drawImage(clean, 0, 0, frameW, frameH, 0, 0, drawW, drawH);
          } else {
            ctx.drawImage(clean, 0, 0, frameW, frameH, ani.x, ani.y, drawW, drawH);
          }
          ctx.restore();
        } else {
          ctx.fillStyle = '#ff8800';
          ctx.fillRect(ani.x + drawW * 0.3, ani.y + drawH * 0.2, drawW * 0.4, drawH * 0.7);
          ctx.beginPath();
          ctx.arc(ani.x + drawW * 0.5, ani.y + drawH * 0.18, drawW * 0.18, 0, Math.PI * 2);
          ctx.fill();
        }

        // Draw Neko — short-hair walk sheet only
        const nFeetX = neko.x + (nekoFrameW * neko.scale) / 2;
        const nFeetY = neko.y + nekoFrameH * neko.scale;
        drawNekoShortHair(nFeetX, nFeetY, neko.frame, 1);
      }

      // Gold / inventory / stats HUD
      drawGoldHud();
      drawPartyStatsHud();

      // Draw menu on top if open
      if (activeMenu === 'map') {
        drawMapMenu();
      } else if (activeMenu === 'weaponShop') {
        drawWeaponShopMenu();
      } else if (activeMenu === 'clothingShop') {
        drawClothingShopMenu();
      } else if (activeMenu === 'barShop') {
        drawBarShopMenu();
      }
    }

    function loop() {
      try {
        update();
        draw();
      } catch (err) {
        console.error('Frame error:', err);
      }
      requestAnimationFrame(loop);
    }
  </script>
</body>
</html>
