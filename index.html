      const maxc = Math.max(r, g, b);
      const minc = Math.min(r, g, b);
      const lum = (r + g + b) / 3;
      const sat = maxc - minc;
      return lum >= 210 && sat <= 28;
    }

    // Flood-fill white/near-white from the edges so enclosed white (ears, tail tip) stays
    function stripWhiteBackground(data, w, h) {
      const n = w * h;
      const bg = new Uint8Array(n); // 1 = background
      const stack = [];

      function trySeed(x, y) {
        if (x < 0 || y < 0 || x >= w || y >= h) return;
        const i = y * w + x;
        if (bg[i]) return;
        const p = i * 4;
        if (isBgPixel(data[p], data[p + 1], data[p + 2])) {
          bg[i] = 1;
          stack.push(i);
        }
      }

      // Seed from all edge pixels
      for (let x = 0; x < w; x++) { trySeed(x, 0); trySeed(x, h - 1); }
      for (let y = 0; y < h; y++) { trySeed(0, y); trySeed(w - 1, y); }

      while (stack.length) {
        const i = stack.pop();
        const x = i % w;
        const y = (i - x) / w;
        // 4-neighborhood
        const neighbors = [i - 1, i + 1, i - w, i + w];
        for (let k = 0; k < 4; k++) {
          const j = neighbors[k];
          if (j < 0 || j >= n) continue;
          if (bg[j]) continue;
          // Keep within image row for left/right
          if (k === 0 && x === 0) continue;
          if (k === 1 && x === w - 1) continue;
          const p = j * 4;
          if (isBgPixel(data[p], data[p + 1], data[p + 2])) {
            bg[j] = 1;
            stack.push(j);
          }
        }
      }

      // Clear background + soften anti-aliased halo around the cutout
      for (let i = 0; i < n; i++) {
        const p = i * 4;
        if (bg[i]) {
          data[p + 3] = 0;
          continue;
        }
        const r = data[p], g = data[p + 1], b = data[p + 2];
        const lum = (r + g + b) / 3;
        const sat = Math.max(r, g, b) - Math.min(r, g, b);
        // Soft near-white fringe next to background (removes the boxy halo)
        if (lum > 200 && sat < 40) {
          const x = i % w;
          const y = (i - x) / w;
          let nextToBg = false;
          if (x > 0 && bg[i - 1]) nextToBg = true;
          else if (x < w - 1 && bg[i + 1]) nextToBg = true;
          else if (y > 0 && bg[i - w]) nextToBg = true;
          else if (y < h - 1 && bg[i + w]) nextToBg = true;
          if (nextToBg) {
            // Fade: whiter = more transparent
            const t = Math.min(1, Math.max(0, (lum - 200) / 55));
            data[p + 3] = Math.floor(data[p + 3] * (1 - t * 0.92));
          }
        }
      }
    }

    function getCleanFrame(frameIndex) {
      if (aniFrameCache[frameIndex]) return aniFrameCache[frameIndex];
      if (!sheet.complete || sheet.naturalWidth === 0 || frameW < 1 || frameH < 1) return null;

      const col = frameIndex % 2, row = Math.floor(frameIndex / 2);
      const cached = document.createElement('canvas');
      cached.width = frameW;
      cached.height = frameH;
      const c = cached.getContext('2d');
      try {
        // Sheet is already alpha-cut (ani_sheet_trans.png) — just slice the frame
        c.clearRect(0, 0, frameW, frameH);
        c.drawImage(sheet, col * frameW, row * frameH, frameW, frameH, 0, 0, frameW, frameH);
        // Optional extra cleanup if someone swaps back to the opaque sheet
        try {
          const imgData = c.getImageData(0, 0, frameW, frameH);
          // Only run strip if corners are still opaque white (opaque source)
          const d = imgData.data;
          const cornerWhite = d[0] > 240 && d[1] > 240 && d[2] > 240 && d[3] > 200;
          if (cornerWhite) {
            stripWhiteBackground(d, frameW, frameH);
            c.putImageData(imgData, 0, 0);
          }
        } catch (err) {
          // file:// may block getImageData — transparent PNG doesn't need it
        }
        aniFrameCache[frameIndex] = cached;
        return cached;
      } catch (err) {
        console.warn('Ani frame draw failed:', err.message);
        return null;
      }
    }

    function getCleanNekoFrame(frameIndex) {
      if (nekoFrameCache[frameIndex]) return nekoFrameCache[frameIndex];
      if (!nekoSheet.complete || nekoSheet.naturalWidth === 0 || nekoFrameW < 1 || nekoFrameH < 1) return null;

      const cached = document.createElement('canvas');
      cached.width = nekoFrameW;
      cached.height = nekoFrameH;
      const c = cached.getContext('2d');
      try {
        const fi = Math.max(0, Math.min(NEKO_FRAME_COUNT - 1, frameIndex));
        c.drawImage(nekoSheet, fi * nekoFrameW, 0, nekoFrameW, nekoFrameH, 0, 0, nekoFrameW, nekoFrameH);
        try {
          const imgData = c.getImageData(0, 0, nekoFrameW, nekoFrameH);
          const data = imgData.data;
          for (let i = 0; i < data.length; i += 4) {
            const r = data[i], g = data[i + 1], b = data[i + 2];
            const lum = (r + g + b) / 3;
            // black / near-black bg
            if (lum < 22) { data[i + 3] = 0; continue; }
            // white / near-white labels
            if (r > 220 && g > 220 && b > 220) data[i + 3] = 0;
            else if (r > 200 && g > 200 && b > 190 && Math.abs(r - g) < 20) data[i + 3] = 0;
          }
          c.putImageData(imgData, 0, 0);
        } catch (err) {
          console.warn('Neko background strip skipped:', err.message);
        }
        nekoFrameCache[frameIndex] = cached;
        return cached;
      } catch (err) {
        console.warn('Neko frame draw failed:', err.message);
        return null;
      }
    }

    function rollDie(sides) {
      return 1 + Math.floor(Math.random() * sides);
    }

    function inventoryCount(id) {
      let n = 0;
      for (let i = 0; i < inventory.length; i++) if (inventory[i] === id) n++;
      return n;
    }

    function removeOneFromInventory(id) {
      const i = inventory.indexOf(id);
      if (i >= 0) { inventory.splice(i, 1); return true; }
      return false;
    }

    function getEffectiveAtk(who) {
      let atk = partyStats[who].atk;
      // Weapon store items: +2 ATK each (Ani katana / Neko claws)
      if (who === 'ani' && inventory.indexOf('fox_sword') >= 0) atk += 2;
      if (who === 'neko' && inventory.indexOf('neko_claws') >= 0) atk += 2;
      return atk;
    }

    function getEffectiveDef(who) {
      let def = partyStats[who].def;
      // Chainmail top from clothing store: +2 DEF (party-wide armor)
      if (inventory.indexOf('chainmail') >= 0) def += 2;
      return def;
    }

    // Damage after target DEF (min 1)
    function calcDamage(atk, def, defending) {
      let dmg = Math.max(1, atk - Math.floor(def / 2));
      if (defending) dmg = Math.max(1, Math.floor(dmg * 0.35));
      return dmg;
    }

    function livingEnemyCount() {
      let n = 0;
      for (let i = 0; i < combat.enemies.length; i++) {
        if (combat.enemies[i].hp > 0) n++;
      }
      return n;
    }

    function firstLivingEnemyIndex() {
      for (let i = 0; i < combat.enemies.length; i++) {
        if (combat.enemies[i].hp > 0) return i;
      }
      return -1;
    }

    function ensureValidTarget() {
      if (!combat.enemies.length) return;
      if (combat.targetIndex < 0 || combat.targetIndex >= combat.enemies.length ||
          combat.enemies[combat.targetIndex].hp <= 0) {
        combat.targetIndex = firstLivingEnemyIndex();
      }
    }

    function partyAllDown() {
      return partyStats.ani.hp <= 0 && partyStats.neko.hp <= 0;
    }

    function changeRoom(target, spawnX, spawnY) {
      if (!rooms[target]) {
        console.warn('Unknown room:', target);
        return;
      }
      // Clear combat when leaving battle arenas (those rooms set combat themselves on enter)
      if (target !== 'warehouseBattle' && target !== 'forestBattle') {
        // After a KO, limp away with some HP so the run can continue
        if (combat.lost || partyStats.ani.hp <= 0 || partyStats.neko.hp <= 0) {
          if (partyStats.ani.hp <= 0) partyStats.ani.hp = Math.max(1, Math.floor(partyStats.ani.maxHp * 0.25));
          if (partyStats.neko.hp <= 0) partyStats.neko.hp = Math.max(1, Math.floor(partyStats.neko.maxHp * 0.25));
        }
        combat.active = false;
        combat.enemies = [];
        combat.won = false;
        combat.lost = false;
        combat.mode = 'training';
        combat.returnRoom = null;
        if (activeMenu === 'combat') activeMenu = null;
      }
      currentRoom = target;
      ani.x = spawnX; ani.y = spawnY;
      ani.targetX = spawnX; ani.targetY = spawnY;
      neko.x = spawnX - 90;
      neko.y = spawnY + 10;
      neko.targetX = neko.x;
      neko.targetY = neko.y;
      roomLabel.textContent = rooms[currentRoom].name;

      // Forest encounter roll when entering an eligible outdoor forest room
      if (FOREST_ENCOUNTER_ROOMS[target]) {
        tryForestEncounter(target);
      }
    }

    // Evenly space N units across the grass strip (feet positions)
    function evenFeetAcross(count, y, leftX, rightX) {
      const pts = [];
      if (count <= 0) return pts;
      if (count === 1) {
        pts.push({ x: (leftX + rightX) / 2, y: y });
        return pts;
      }
      for (let i = 0; i < count; i++) {
        const t = i / (count - 1);
        pts.push({ x: leftX + (rightX - leftX) * t, y: y });
      }
      return pts;
    }

    // Layout: party LEFT, enemies RIGHT — clear gap so wide sprites don't stack
    function layoutForestArena(enemyCount) {
      const feetY = 310; // on grass strip, above combat menu (y=370)
      // Girls evenly on left (slightly wider for larger Neko/Ani)
      const party = evenFeetAcross(2, feetY, 55, 230);
      combat.partyFeet.neko = { x: party[0].x, y: party[0].y };
      combat.partyFeet.ani = { x: party[1].x, y: party[1].y };
      // Enemies evenly on right half (matched size, spaced)
      return evenFeetAcross(enemyCount, feetY, 330, 590);
    }

    // Grant XP for a kill; level up when threshold reached (+10% next req)
    function grantKillXp(amount) {
      const n = amount == null ? 5 : amount;
      partyProgress.xp += n;
      let leveled = 0;
      while (partyProgress.xp >= partyProgress.xpToNext) {
        partyProgress.xp -= partyProgress.xpToNext;
        partyProgress.level++;
        leveled++;
        // +10% XP required each level (ceil so it always grows)
        partyProgress.xpToNext = Math.max(
          partyProgress.xpToNext + 1,
          Math.ceil(partyProgress.xpToNext * 1.1)
        );
        // Small permanent stat bumps on level-up
        partyStats.ani.maxHp += 3;
        partyStats.ani.hp = Math.min(partyStats.ani.maxHp, partyStats.ani.hp + 3);
        partyStats.ani.atk += 1;
        partyStats.neko.maxHp += 3;
        partyStats.neko.hp = Math.min(partyStats.neko.maxHp, partyStats.neko.hp + 3);
        partyStats.neko.atk += 1;
      }
      if (leveled > 0) {
        shopToast = 'LEVEL UP! Now Lv ' + partyProgress.level +
          '  (next in ' + partyProgress.xpToNext + ' XP)';
        shopToastTimer = 180;
      }
      return n;
    }

    // Enemies scale below average party ATK/DEF/HP
    function buildForestEnemies(count) {
      const avgAtk = (getEffectiveAtk('ani') + getEffectiveAtk('neko')) / 2;
      const avgDef = (getEffectiveDef('ani') + getEffectiveDef('neko')) / 2;
      const avgHp = (partyStats.ani.maxHp + partyStats.neko.maxHp) / 2;
      // Enemies scale off party averages — keep them a clear step below
      // (0.75 ≈ 25% weaker; old 0.85 made 2v3 too swingy even with potions)
      const scale = 0.75;
      const eAtk = Math.max(1, Math.floor(avgAtk * scale));
      const eDef = Math.max(1, Math.floor(avgDef * scale));
      const eHp = Math.max(8, Math.floor(avgHp * scale));
      const enemyFeet = layoutForestArena(count);
      const enemies = [];
      // Prefer unique types when 1–3: Bandit, Rogue, Hound
      for (let i = 0; i < count; i++) {
        const type = i % 3;
        enemies.push({
          name: enemyTypeNames[type] || ('Enemy ' + (i + 1)),
          hp: eHp,
          maxHp: eHp,
          atk: eAtk,
          def: eDef,
          artIndex: type, // 0=male, 1=female, 2=hound
          feetX: enemyFeet[i].x,
          feetY: enemyFeet[i].y
        });
      }
      return enemies;
    }

    function tryForestEncounter(roomId) {
      if (!FOREST_ENCOUNTER_ROOMS[roomId]) return;
      if (combat.active) return;
      const roll = rollDie(20);
      combat.lastRoll = roll;
      if (roll < FOREST_ENCOUNTER_DC) {
        shopToast = 'd20: ' + roll + ' (need ' + FOREST_ENCOUNTER_DC + '+) — path is clear.';
        shopToastTimer = 100;
        return;
      }
      const count = rollDie(3); // 1–3 enemies
      startForestBattle(count, roll, roomId);
    }

    function startForestBattle(count, roll, fromRoom) {
      // Remember where we came from so Continue returns there
      combat.returnRoom = fromRoom || currentRoom || 'forestEntrance';
      combat.returnSpawnX = typeof ani.x === 'number' ? ani.x : 300;
      combat.returnSpawnY = typeof ani.y === 'number' ? ani.y : 300;

      combat.active = true;
      combat.mode = 'forest';
      combat.enemies = buildForestEnemies(count);
      combat.targetIndex = 0;
      combat.turn = partyStats.ani.hp > 0 ? 'ani' : 'neko';
      combat.defending.ani = false;
      combat.defending.neko = false;
      combat.won = false;
      combat.lost = false;
      combat.anim = null;
      combat.log = 'd20=' + roll + '! ' + count + ' rogue' + (count > 1 ? 's' : '') +
        ' appear! (weaker than you)';
      activeMenu = 'combat';
      shopToast = 'AMBUSH! Entering skirmish field…';
      shopToastTimer = 100;

      // Wire exit pad back to the forest room we left
      if (rooms.forestBattle && rooms.forestBattle.doors[0]) {
        rooms.forestBattle.doors[0].target = combat.returnRoom;
        rooms.forestBattle.doors[0].spawnX = combat.returnSpawnX;
        rooms.forestBattle.doors[0].spawnY = combat.returnSpawnY;
      }

      // Switch to empty grass arena (skip changeRoom so combat is not cleared)
      currentRoom = 'forestBattle';
      roomLabel.textContent = rooms.forestBattle.name;

      // Snap party to laid-out feet
      const af = combat.partyFeet.ani;
      const nf = combat.partyFeet.neko;
      const aniDrawH = frameH * ani.scale * 0.95;
      const nekoDrawH = nekoFrameH * neko.scale * 0.95;
      ani.x = af.x - (frameW * ani.scale * 0.95) / 2;
      ani.y = af.y - aniDrawH;
      ani.targetX = ani.x; ani.targetY = ani.y;
      ani.facing = 1;
      neko.x = nf.x - (nekoFrameW * neko.scale * 0.95) / 2;
      neko.y = nf.y - nekoDrawH;
      neko.targetX = neko.x; neko.targetY = neko.y;
      neko.facing = 1;
    }

    function startWarehouseBattle() {
      combat.active = true;
      combat.mode = 'training';
      combat.enemies = [];
      combat.turn = 'ani';
      combat.dummyHp = combat.dummyMaxHp;
      combat.defending.ani = false;
      combat.defending.neko = false;
      combat.log = "Ani's turn — choose Attack or Defend.";
      combat.won = false;
      combat.lost = false;
      combat.anim = null;
      // Spawn already standing above the speech bar (left half)
      // bypass forest encounter by setting room directly
      currentRoom = 'warehouseBattle';
      ani.x = 140; ani.y = 200;
      ani.targetX = 140; ani.targetY = 200;
      neko.x = 40; neko.y = 220;
      neko.targetX = neko.x; neko.targetY = neko.y;
      roomLabel.textContent = rooms[currentRoom].name;
      activeMenu = 'combat';
    }

    function combatAttack() {
      if (!combat.active || combat.won || combat.lost || combat.anim) return;
      if (partyStats[combat.turn].hp <= 0) return;
      const who = combat.turn;
      const name = partyStats[who].name;
      let targetDef = 4; // training dummy
      if (combat.mode === 'forest') {
        ensureValidTarget();
        if (combat.targetIndex < 0) return;
        targetDef = combat.enemies[combat.targetIndex].def;
      }
      const dmg = calcDamage(getEffectiveAtk(who), targetDef, false);
      combat.defending[who] = false;
      combat.log = name + ' attacks...';
      combat.anim = {
        who: who,
        type: 'attack',
        frame: 0,
        timer: 0,
        maxFrames: who === 'neko' ? 4 : COMBAT_FRAMES,
        pending: { kind: 'attack', who: who, name: name, dmg: dmg }
      };
    }

    function combatDefend() {
      if (!combat.active || combat.won || combat.lost || combat.anim) return;
      if (partyStats[combat.turn].hp <= 0) return;
      const who = combat.turn;
      const name = partyStats[who].name;
      combat.defending[who] = true;
      combat.log = name + ' braces to defend...';
      combat.anim = {
        who: who,
        type: 'defend',
        frame: 0,
        timer: 0,
        maxFrames: who === 'neko' ? 2 : COMBAT_FRAMES,
        pending: { kind: 'defend', who: who, name: name }
      };
    }

    // Use one potion from inventory: +25 HP (capped at max), ends the turn
    function combatHeal() {
      if (!combat.active || combat.won || combat.lost || combat.anim) return;
      const who = combat.turn;
      if (partyStats[who].hp <= 0) return;
      if (inventoryCount('potion') <= 0) {
        combat.log = 'No potions in inventory!';
        return;
      }
      const st = partyStats[who];
      if (st.hp >= st.maxHp) {
        combat.log = st.name + ' is already at full HP.';
        return;
      }
      removeOneFromInventory('potion');
      const before = st.hp;
      st.hp = Math.min(st.maxHp, st.hp + 25);
      const gained = st.hp - before;
      combat.defending[who] = false;
      combat.log = st.name + ' drinks a potion (+' + gained + ' HP). ' +
        inventoryCount('potion') + ' left.';
      // Heal still ends the turn — enemies get a swing
      if (combat.mode === 'forest') {
        forestEnemyStrikes(who);
      } else {
        dummyCounterstrike(st.name, who);
      }
      if (!combat.lost) advanceCombatTurn();
    }

    function finishCombatAction() {
      if (!combat.anim || !combat.anim.pending) {
        combat.anim = null;
        return;
      }
      const p = combat.anim.pending;
      combat.anim = null;

      if (combat.mode === 'forest') {
        finishForestAction(p);
        return;
      }

      // Training dummy path
      if (p.kind === 'attack') {
        combat.dummyHp = Math.max(0, combat.dummyHp - p.dmg);
        combat.log = p.name + ' hits for ' + p.dmg + '!';
        if (combat.dummyHp <= 0) {
          combat.won = true;
          combat.log = p.name + ' lands the finishing blow! Training complete.';
          activeMenu = null;
          return;
        }
        dummyCounterstrike(p.name, p.who);
      } else {
        combat.log = p.name + ' braces to defend.';
        dummyCounterstrike(p.name, p.who);
      }
      advanceCombatTurn();
    }

    // Gold + potion loot after a forest clear
    function applyForestVictoryLoot() {
      const n = combat.enemies.length;
      // 10 gold per enemy defeated (already paid per kill; this is a summary pass)
      // Per-kill already adds 10g — don't double-pay here. Only potion bonus + toast.
      let potDrop = false;
      if (n >= 3) {
        // 3v2 always drops a potion
        potDrop = true;
      } else if (n === 2) {
        // 2v2: sometimes (~45%)
        potDrop = Math.random() < 0.45;
      }
      if (potDrop) {
        inventory.push('potion');
      }
      const goldTotal = n * 10;
      let msg = 'Victory! +' + goldTotal + 'g';
      if (potDrop) msg += ' + potion!';
      msg += '  Lv' + partyProgress.level +
        ' (' + partyProgress.xp + '/' + partyProgress.xpToNext + ' XP)';
      combat.log += ' ' + msg;
      shopToast = msg;
      shopToastTimer = 180;
      return { goldTotal: goldTotal, potDrop: potDrop };
    }

    function finishForestAction(p) {
      if (p.kind === 'attack') {
        ensureValidTarget();
        if (combat.targetIndex < 0) {
          combat.won = true;
          applyForestVictoryLoot();
          return;
        }
        const e = combat.enemies[combat.targetIndex];
        e.hp = Math.max(0, e.hp - p.dmg);
        combat.log = p.name + ' hits ' + e.name + ' for ' + p.dmg + '!';
        if (e.hp <= 0) {
          const xpGot = grantKillXp(5);
          // Always 10 gold per enemy defeated
          playerGold += 10;
          combat.log += ' ' + e.name + ' falls! (+' + xpGot + ' XP, +10g)';
        }
        if (livingEnemyCount() <= 0) {
          combat.won = true;
          applyForestVictoryLoot();
          return;
        }
        ensureValidTarget();
        forestEnemyStrikes(p.who);
      } else {
        combat.log = p.name + ' braces to defend.';
        forestEnemyStrikes(p.who);
      }
      if (combat.lost) return;
      advanceCombatTurn();
    }

    function forestEnemyStrikes(targetWho) {
      if (combat.won || combat.lost) return;
      // Each living enemy swings at the character who just acted (or a living ally)
      let who = targetWho;
      if (partyStats[who].hp <= 0) {
        who = partyStats.ani.hp > 0 ? 'ani' : 'neko';
      }
      for (let i = 0; i < combat.enemies.length; i++) {
        const e = combat.enemies[i];
        if (e.hp <= 0) continue;
        if (partyAllDown()) break;
        // Prefer the acting character; if down, hit whoever still stands
        let t = who;
        if (partyStats[t].hp <= 0) t = partyStats.ani.hp > 0 ? 'ani' : 'neko';
        if (partyStats[t].hp <= 0) break;
        const dmg = calcDamage(e.atk, getEffectiveDef(t), combat.defending[t]);
        partyStats[t].hp = Math.max(0, partyStats[t].hp - dmg);
        const tName = partyStats[t].name;
        if (combat.defending[t]) {
          combat.log += ' ' + e.name + ' hits ' + tName + ' for ' + dmg + ' (blocked).';
        } else {
          combat.log += ' ' + e.name + ' hits ' + tName + ' for ' + dmg + '.';
        }
      }
      if (partyAllDown()) {
        combat.lost = true;
        combat.log += ' Your party is down! Flee to the van when you can.';
        shopToast = 'Defeated… FLEE TO VAN to escape the forest.';
        shopToastTimer = 160;
      }
    }

    function dummyCounterstrike(targetName, who) {
      if (combat.won || combat.dummyHp <= 0) return;
      // Dummy atk ~ scaled slightly under party for training feel
      const dmg = calcDamage(6, getEffectiveDef(who), combat.defending[who]);
      partyStats[who].hp = Math.max(0, partyStats[who].hp - dmg);
      if (combat.defending[who]) {
        combat.log += ' Dummy hits ' + targetName + ' for ' + dmg + ' (blocked).';
      } else {
        combat.log += ' Dummy hits ' + targetName + ' for ' + dmg + '.';
      }
    }

    function advanceCombatTurn() {
      // Prefer next living party member
      const order = combat.turn === 'ani' ? ['neko', 'ani'] : ['ani', 'neko'];
      let next = null;
      for (let i = 0; i < order.length; i++) {
        if (partyStats[order[i]].hp > 0) { next = order[i]; break; }
      }
      if (!next) {
        combat.lost = true;
        return;
      }
      combat.turn = next;
      if (!combat.won && !combat.lost) {
        combat.log += '  → ' + partyStats[next].name + "'s turn.";
      }
    }

    // Combat sheets: title banner on top, then 2×3 pose grid per character.
    // Left half = Ani, right half = Neko. Frames 0..4 = poses 1..5.
    function getCombatPose(who, type, frameIndex) {
      // v6: lighter top crop so Ani's head/ears aren't cut; still skip sheet title
      const key = 'v6_' + type + '_' + who + '_' + frameIndex;
      if (combatFrameCache[key]) return combatFrameCache[key];
      const sheetImg = type === 'defend' ? combatDefendSheet : combatAttackSheet;
      if (!sheetImg.complete || !sheetImg.naturalWidth) return null;

      const iw = sheetImg.naturalWidth;
      const ih = sheetImg.naturalHeight;
      // Title banner only ("Ani - Foxgirl Katana…") — keep small so heads stay in frame
      const titleH = Math.floor(ih * 0.09);
      const bodyH = ih - titleH;
      const halfW = Math.floor(iw / 2);
      const baseX = who === 'neko' ? halfW : 0;

      // 2 cols × 3 rows of poses in the body area (below titles)
      const cols = 2, rows = 3;
      const fw = Math.floor(halfW / cols);
      const fh = Math.floor(bodyH / rows);

      // Sheet labels: top 1,2 / mid / bot 4,5
      const orderAni = [
        [0, 0], [1, 0], [0, 1], [1, 1], [1, 2]
      ];

      const fi = Math.max(0, Math.min(COMBAT_FRAMES - 1, frameIndex));
      const lc = orderAni[fi][0];
      const lr = orderAni[fi][1];

      // Minimal top pad (heads + ears), almost no bottom pad (legs)
      const padX = Math.floor(fw * 0.08);
      const padTop = Math.floor(fh * 0.04);
      const padBot = Math.floor(fh * 0.02);
      const sx = baseX + lc * fw + padX;
      const sy = titleH + lr * fh + padTop;
      const sw = Math.max(8, fw - padX * 2);
      const sh = Math.max(8, fh - padTop - padBot);

      const cached = document.createElement('canvas');
      cached.width = sw;
      cached.height = sh;
      const c = cached.getContext('2d');
      try {
        c.clearRect(0, 0, sw, sh);
        c.drawImage(sheetImg, sx, sy, sw, sh, 0, 0, sw, sh);
        // Strip black sheet bg + pure white pose cards
        try {
          const imgData = c.getImageData(0, 0, sw, sh);
          const data = imgData.data;
          for (let i = 0; i < data.length; i += 4) {
            const r = data[i], g = data[i + 1], b = data[i + 2];
            const maxc = Math.max(r, g, b);
            const minc = Math.min(r, g, b);
            const lum = (r + g + b) / 3;
            if (lum < 22) { data[i + 3] = 0; continue; }
            // white / near-white card behind figure
            if (lum > 225 && (maxc - minc) < 35) { data[i + 3] = 0; continue; }
          }
          c.putImageData(imgData, 0, 0);
        } catch (err) { /* file:// may block */ }
        combatFrameCache[key] = cached;
        return cached;
      } catch (err) {
        return null;
      }
    }

    // Draw short-hair Neko from her walk sheet (overworld)
    function drawNekoShortHair(feetX, feetY, frameIndex, scaleMul) {
      const mul = scaleMul == null ? 1 : scaleMul;
      const clean = getCleanNekoFrame(frameIndex);
      const dw = nekoFrameW * neko.scale * mul;
      const dh = nekoFrameH * neko.scale * mul;
      const dx = feetX - dw / 2;
      const dy = feetY - dh;

      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.beginPath();
      ctx.ellipse(feetX, feetY - 4, dw * 0.28, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      if (clean) {
        ctx.save();
        if (neko.facing === -1) {
          ctx.translate(feetX, 0);
          ctx.scale(-1, 1);
          ctx.drawImage(clean, 0, 0, nekoFrameW, nekoFrameH, -dw / 2, dy, dw, dh);
        } else {
          ctx.drawImage(clean, 0, 0, nekoFrameW, nekoFrameH, dx, dy, dw, dh);
        }
        ctx.restore();
      }
      return { dx: dx, dy: dy, dw: dw, dh: dh };
    }

    // Neko short-hair attack sheet: 2×2 main poses
    // 0 wind-up, 1 mid slash, 2 follow-through, 3 idle stance
    function getNekoSwingPose(frameIndex) {
      const key = 'neko_swing_v2_' + frameIndex;
      if (combatFrameCache[key]) return combatFrameCache[key];
      if (!nekoAttackSheet.complete || !nekoAttackSheet.naturalWidth) return null;

      const cols = 2, rows = 2;
      const fw = Math.floor(nekoAttackSheet.naturalWidth / cols);
      const fh = Math.floor(nekoAttackSheet.naturalHeight / rows);
      const fi = Math.max(0, Math.min(3, frameIndex));
      const col = fi % 2;
      const row = Math.floor(fi / 2);

      // Keep more of the figure (legs); light side inset only
      const padX = Math.floor(fw * 0.08);
      const padTop = Math.floor(fh * 0.05);
      const padBot = Math.floor(fh * 0.04);
      const sx = col * fw + padX;
      const sy = row * fh + padTop;
      const sw = fw - padX * 2;
      const sh = fh - padTop - padBot;

      const cached = document.createElement('canvas');
      cached.width = sw;
      cached.height = sh;
      const c = cached.getContext('2d');
      try {
        c.clearRect(0, 0, sw, sh);
        c.drawImage(nekoAttackSheet, sx, sy, sw, sh, 0, 0, sw, sh);
        try {
          const imgData = c.getImageData(0, 0, sw, sh);
          const data = imgData.data;
          for (let i = 0; i < data.length; i += 4) {
            const lum = (data[i] + data[i + 1] + data[i + 2]) / 3;
            if (lum < 22) data[i + 3] = 0;
          }
          c.putImageData(imgData, 0, 0);
        } catch (err) { /* file:// */ }
        combatFrameCache[key] = cached;
        return cached;
      } catch (err) {
        return null;
      }
    }

    // Fit a sprite into max box (contain) so wide sheet crops never dominate the arena
    function fitSpriteSize(srcW, srcH, maxW, maxH) {
      const sc = Math.min(maxW / srcW, maxH / srcH);
      return { dw: srcW * sc, dh: srcH * sc, sc: sc };
    }

    // Draw fighter — Ani: long swing sheets; Neko: short-hair swing sheet 1–4 for attack
    // Shared scale band so party + bandits read the same size on the grass
    function drawCombatFighter(who, feetX, feetY) {
      // Neko a bit taller than Ani; both larger than previous cap
      const maxH = who === 'neko' ? 185 : 170;
      const maxW = who === 'neko' ? 110 : 100;

      // ---- Neko: short-hair only ----
      if (who === 'neko') {
        let pose = null;
        if (combat.anim && combat.anim.who === 'neko' && combat.anim.type === 'attack') {
          pose = getNekoSwingPose(combat.anim.frame);
        } else if (combat.anim && combat.anim.who === 'neko' && combat.anim.type === 'defend') {
          pose = getNekoSwingPose(combat.anim.frame === 0 ? 3 : 0);
        } else if (combat.defending.neko) {
          pose = getNekoSwingPose(3);
        } else {
          pose = getNekoSwingPose(3);
        }

        if (!pose) {
          drawNekoShortHair(feetX, feetY, NEKO_IDLE, 0.88);
        } else {
          const fit = fitSpriteSize(pose.width, pose.height, maxW, maxH);
          const dw = fit.dw, dh = fit.dh;
          const dx = feetX - dw / 2;
          const dy = feetY - dh;
          ctx.fillStyle = 'rgba(0,0,0,0.28)';
          ctx.beginPath();
          ctx.ellipse(feetX, feetY - 2, dw * 0.28, 6, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.drawImage(pose, dx, dy, dw, dh);

          if (combat.active && !combat.won && combat.turn === 'neko' && !combat.anim) {
            ctx.fillStyle = '#c9a0ff';
            ctx.font = 'bold 11px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText('▼', feetX, dy - 6);
            ctx.textAlign = 'left';
          }
        }
        return;
      }

      // ---- Ani: attack/defend swing sheets ----
      let type = 'attack';
      let frame = 0;
      if (combat.defending.ani && !(combat.anim && combat.anim.who === 'ani')) {
        type = 'defend';
        frame = 0;
      }
      if (combat.anim && combat.anim.who === 'ani') {
        type = combat.anim.type;
        frame = combat.anim.frame;
      }

      const pose = getCombatPose('ani', type, frame);

      if (!pose) {
        const clean = getCleanFrame(IDLE_FRAME);
        if (clean) {
          const fit = fitSpriteSize(frameW, frameH, maxW, maxH);
          ctx.drawImage(clean, 0, 0, frameW, frameH, feetX - fit.dw / 2, feetY - fit.dh, fit.dw, fit.dh);
        }
        return;
      }

      const fit = fitSpriteSize(pose.width, pose.height, maxW, maxH);
      const dw = fit.dw, dh = fit.dh;
      const dx = feetX - dw / 2;
      const dy = feetY - dh;

      ctx.fillStyle = 'rgba(0,0,0,0.28)';
      ctx.beginPath();
      ctx.ellipse(feetX, feetY - 2, dw * 0.28, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.drawImage(pose, dx, dy, dw, dh);

      if (combat.active && !combat.won && combat.turn === 'ani' && !combat.anim) {
        ctx.fillStyle = '#ff9a4a';
        ctx.font = 'bold 11px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('▼', feetX, dy - 6);
        ctx.textAlign = 'left';
      }
    }

    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
      const my = (e.clientY - rect.top) * (canvas.height / rect.height);

      // If a menu is open, handle menu clicks first
      if (activeMenu === 'map') {
        // Close button (top right of map panel)
        if (mx >= 520 && mx <= 555 && my >= 55 && my <= 90) {
          activeMenu = null;
          return;
        }
        // Clicking outside the map panel also closes it
        if (mx < 80 || mx > 560 || my < 50 || my > 430) {
          activeMenu = null;
          return;
        }
        // Travel to map locations
        for (let i = 0; i < mapLocations.length; i++) {
          const loc = mapLocations[i];
          if (loc.locked) continue;
          if (mx >= loc.x && mx <= loc.x + loc.w && my >= loc.y && my <= loc.y + loc.h) {
            activeMenu = null;
            changeRoom(loc.target, loc.spawnX, loc.spawnY);
            return;
          }
        }
        return;
      }

      if (activeMenu === 'weaponShop') {
        // Select item rows
        if (mx >= 95 && mx <= 545 && my >= 135 && my <= 210) {
          shopSelected = 0; // fox blade / katana
          return;
        }
        if (mx >= 95 && mx <= 545 && my >= 215 && my <= 290) {
          shopSelected = 1; // neko claws
          return;
        }
        // Buy button
        if (mx >= 360 && mx <= 440 && my >= 310 && my <= 350) {
          const items = [
            { id: 'fox_sword', name: 'Fox Katana', price: 20, unique: true },
            { id: 'neko_claws', name: 'Neko Claws', price: 20, unique: true }
          ];
          const item = items[shopSelected] || items[0];
          if (item.unique && inventory.indexOf(item.id) >= 0) {
            shopToast = 'You already own ' + item.name + '.';
            shopToastTimer = 120;
          } else if (playerGold < item.price) {
            shopToast = 'Not enough gold! (need ' + item.price + ')';
            shopToastTimer = 120;
          } else {
            playerGold -= item.price;
            inventory.push(item.id);
            shopToast = 'Purchased ' + item.name + '! (+2 ATK)';
            shopToastTimer = 120;
          }
          return;
        }
        // Cancel button
        if (mx >= 460 && mx <= 550 && my >= 310 && my <= 350) {
          activeMenu = null;
          shopToast = '';
          return;
        }
        // Click outside panel closes
        if (mx < 70 || mx > 570 || my < 60 || my > 400) {
          activeMenu = null;
          shopToast = '';
          return;
        }
        return;
      }

      if (activeMenu === 'clothingShop') {
        // Select chainmail row
        if (mx >= 95 && mx <= 545 && my >= 140 && my <= 230) {
          shopSelected = 0;
          return;
        }
        // Buy
        if (mx >= 360 && mx <= 440 && my >= 300 && my <= 340) {
          const item = { id: 'chainmail', name: 'Chainmail Top', price: 25 };
          if (inventory.indexOf(item.id) >= 0) {
            shopToast = 'You already own ' + item.name + '.';
            shopToastTimer = 120;
          } else if (playerGold < item.price) {
            shopToast = 'Not enough gold! (need ' + item.price + ')';
            shopToastTimer = 120;
          } else {
            playerGold -= item.price;
            inventory.push(item.id);
            shopToast = 'Purchased Chainmail Top! (+2 DEF)';
            shopToastTimer = 120;
          }
          return;
        }
        // Close
        if (mx >= 460 && mx <= 550 && my >= 300 && my <= 340) {
          activeMenu = null;
          shopToast = '';
          return;
        }
        if (mx < 70 || mx > 570 || my < 70 || my > 380) {
          activeMenu = null;
          shopToast = '';
          return;
        }
        return;
      }

      if (activeMenu === 'barShop') {
        // Select potion row
        if (mx >= 95 && mx <= 545 && my >= 140 && my <= 230) {
          shopSelected = 0;
          return;
        }
        // Buy potion (stackable)
        if (mx >= 360 && mx <= 440 && my >= 300 && my <= 340) {
          const price = 12;
          if (playerGold < price) {
            shopToast = 'Not enough gold! (need ' + price + ')';
            shopToastTimer = 120;
          } else {
            playerGold -= price;
            inventory.push('potion');
            shopToast = 'Bought Health Potion! (+25 HP when used)  x' + inventoryCount('potion');
            shopToastTimer = 140;
          }
          return;
        }
        // Close
        if (mx >= 460 && mx <= 550 && my >= 300 && my <= 340) {
          activeMenu = null;
          shopToast = '';
          return;
        }
        if (mx < 70 || mx > 570 || my < 70 || my > 380) {
          activeMenu = null;
          shopToast = '';
          return;
        }
        return;
      }

      // Whiskers van click on the roof → map
      if (currentRoom === 'garageTopFloor') {
        if (mx >= vanHitbox.x && mx <= vanHitbox.x + vanHitbox.w &&
            my >= vanHitbox.y && my <= vanHitbox.y + vanHitbox.h) {
          activeMenu = 'map';
          return;
        }
      }

      // Weapons merchant click
      if (currentRoom === 'weaponStore') {
        const n = weaponNpcHitbox;
        if (mx >= n.x && mx <= n.x + n.w && my >= n.y && my <= n.y + n.h) {
          activeMenu = 'weaponShop';
          shopSelected = 0;
          shopToast = '';
          return;
        }
      }

      // Clothing merchant click
      if (currentRoom === 'clothingStore') {
        const n = clothingNpcHitbox;
        if (mx >= n.x && mx <= n.x + n.w && my >= n.y && my <= n.y + n.h) {
          activeMenu = 'clothingShop';
          shopSelected = 0;
          shopToast = '';
          return;
        }
      }

      // Bar maiden click — open potion shop
      if (currentRoom === 'bar') {
        const n = barMaidenHitbox;
        if (mx >= n.x && mx <= n.x + n.w && my >= n.y && my <= n.y + n.h) {
          activeMenu = 'barShop';
          shopSelected = 0;
          shopToast = 'Bar maiden: "Need a heal draught, love?"';
          shopToastTimer = 120;
          return;
        }
      }

      // Garage rogues — short banter
      if (currentRoom === 'parkingGarageLevel3') {
        const n = rogueL3Hitbox;
        if (mx >= n.x && mx <= n.x + n.w && my >= n.y && my <= n.y + n.h) {
          shopToast = 'Rogue: "Keep your voice down… this floor\'s watched."';
          shopToastTimer = 180;
          return;
        }
      }
      if (currentRoom === 'parkingGarageLevel4') {
        const n = rogueL4Hitbox;
        if (mx >= n.x && mx <= n.x + n.w && my >= n.y && my <= n.y + n.h) {
          shopToast = 'Rogue: "Roof access is past the arch. Don\'t make a scene."';
          shopToastTimer = 180;
          return;
        }
      }

      // Warehouse training box → start turn-based fight
      if (currentRoom === 'warehouse') {
        const b = trainingBoxHitbox;
        if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) {
          startWarehouseBattle();
          return;
        }
      }

      // After forest win/loss — center LEAVE / FLEE panel
      if (combat.active && combat.mode === 'forest' && (combat.won || combat.lost)) {
        const pw = 280, ph = 110;
        const px = (canvas.width - pw) / 2;
        const py = 160;
        const leaveFight = function () {
          if (combat.lost) {
            // Flee back to the van roof so you aren't stuck re-rolling forest ambushes
            changeRoom('garageTopFloor', 280, 300);
          } else {
            const dest = combat.returnRoom || 'forestEntrance';
            const sx = combat.returnSpawnX != null ? combat.returnSpawnX : 300;
            const sy = combat.returnSpawnY != null ? combat.returnSpawnY : 300;
            changeRoom(dest, sx, sy);
          }
        };
        // Center button area
        if (mx >= px + 40 && mx <= px + pw - 40 && my >= py + 62 && my <= py + 98) {
          leaveFight();
          return;
        }
        // Whole panel clickable too
        if (mx >= px && mx <= px + pw && my >= py && my <= py + ph) {
          leaveFight();
          return;
        }
        return;
      }

      // Stats button (top-left chip) — toggle stats menu outside combat
      // During combat stats are always shown; chip still toggles expanded detail
      if (mx >= 8 && mx <= 78 && my >= 8 && my <= 32) {
        statsMenuOpen = !statsMenuOpen;
        return;
      }
      // Close expanded stats by clicking outside panel (when not in combat)
      if (statsMenuOpen && !combat.active) {
        if (mx < 8 || mx > 200 || my < 8 || my > 230) {
          // allow other clicks; don't force close on every miss — only if they click the chip again
        }
      }

      // Combat menu (attack / defend / heal) — warehouse + forest
      if (combat.active && !combat.won && !combat.lost && !combat.anim && activeMenu === 'combat') {
        // Click forest enemies to select target
        if (combat.mode === 'forest') {
          for (let i = 0; i < combat.enemies.length; i++) {
            const e = combat.enemies[i];
            if (e.hp <= 0) continue;
            // Approximate sprite hitbox above feet
            const hx = e.feetX - 40, hy = e.feetY - 160, hw = 80, hh = 160;
            if (mx >= hx && mx <= hx + hw && my >= hy && my <= hy + hh) {
              combat.targetIndex = i;
              combat.log = 'Targeting ' + e.name + '.';
              return;
            }
          }
        }
        // HEAL button (needs potion in inventory)
        if (mx >= 20 && mx <= 140 && my >= 400 && my <= 450) {
          combatHeal();
          return;
        }
        // Attack button
        if (mx >= 155 && mx <= 295 && my >= 400 && my <= 450) {
          combatAttack();
          return;
        }
        // Defend button
        if (mx >= 310 && mx <= 450 && my >= 400 && my <= 450) {
          combatDefend();
          return;
        }
        return; // swallow other clicks during combat
      }

      // Normal door clicks (blocked mid-fight until win/loss)
      if (!(combat.active && !combat.won && !combat.lost)) {
        for (const d of rooms[currentRoom].doors) {
          if (mx >= d.x && mx <= d.x + d.w && my >= d.y && my <= d.y + d.h) {
            // Flee from forest skirmish always returns to the van roof
            if (currentRoom === 'forestBattle' && combat.lost) {
              changeRoom('garageTopFloor', 280, 300);
              return;
            }
            changeRoom(d.target, d.spawnX, d.spawnY);
            return;
          }
        }
      }

      // No free walking while combat is up (including win/loss until Continue)
      if (activeMenu === 'combat' && combat.active) return;

      // Walk to clicked position (keep feet in walkable band)
      const aw = frameW * ani.scale;
      const ah = frameH * ani.scale;
      ani.targetX = Math.min(Math.max(mx - aw / 2, -aw * 0.2), canvas.width - aw * 0.3);
      ani.targetY = Math.min(Math.max(my - ah * 0.75, 40), canvas.height - ah * 0.85);

      // Dangerous forest: roll encounter again on each walk-click
      if (FOREST_ENCOUNTER_ROOMS[currentRoom] && !combat.active && !activeMenu) {
        tryForestEncounter(currentRoom);
      }
    });

    function update() {
      if (shopToastTimer > 0) shopToastTimer--;

      // Advance combat attack/defend animation
      if (combat.anim) {
        combat.anim.timer++;
        if (combat.anim.timer >= COMBAT_FRAME_TICKS) {
          combat.anim.timer = 0;
          combat.anim.frame++;
          const maxF = combat.anim.maxFrames || COMBAT_FRAMES;
          if (combat.anim.frame >= maxF) {
            finishCombatAction();
          }
        }
      }

      // Freeze free walking during map/shop menus
      if (activeMenu && activeMenu !== 'combat') return;
      // During combat, park both girls just above the speech/combat bar (y≈370)
      // Hold combat layout while in a fight (including win/loss until you leave)
      if (activeMenu === 'combat' && combat.active) {
        const aniDrawH = frameH * ani.scale * 0.95;
        const nekoDrawH = nekoFrameH * neko.scale * 0.95;
        if (combat.mode === 'forest' && combat.partyFeet) {
          // Hold laid-out arena positions (even spacing with enemies)
          const af = combat.partyFeet.ani;
          const nf = combat.partyFeet.neko;
          ani.targetX = af.x - (frameW * ani.scale * 0.95) / 2;
          ani.targetY = af.y - aniDrawH;
          neko.targetX = nf.x - (nekoFrameW * neko.scale * 0.95) / 2;
          neko.targetY = nf.y - nekoDrawH;
          ani.facing = 1;
          neko.facing = 1;
        } else if (!combat.won && !combat.lost) {
          // Warehouse training: left side above menu
          const combatFeetY = 368;
          ani.targetX = 175 - (frameW * ani.scale * 0.95) / 2;
          ani.targetY = combatFeetY - aniDrawH;
          neko.targetX = 55 - (nekoFrameW * neko.scale * 0.95) / 2;
          neko.targetY = combatFeetY - nekoDrawH;
        }
        if (!combat.anim) {
          ani.frame = IDLE_FRAME;
          neko.frame = NEKO_IDLE;
        }
      }

      const dx = ani.targetX - ani.x, dy = ani.targetY - ani.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist > 3) {
        ani.x += (dx / dist) * ani.speed;
        ani.y += (dy / dist) * ani.speed;
        if (dx > 0.5) ani.facing = 1;
        if (dx < -0.5) ani.facing = -1;
        ani.animTimer++;
        if (ani.animTimer > 12) {
          ani.animTimer = 0;
          ani.frame = (ani.frame === WALK_FRAMES[0]) ? WALK_FRAMES[1] : WALK_FRAMES[0];
        }
      } else {
        ani.frame = IDLE_FRAME;
        ani.x = ani.targetX; ani.y = ani.targetY;
      }

      const ndx = (ani.x - 85) - neko.x;
      const ndy = (ani.y + 8) - neko.y;
      const ndist = Math.sqrt(ndx*ndx + ndy*ndy);
      if (ndist > 35) {
        neko.x += (ndx / ndist) * neko.speed;
        neko.y += (ndy / ndist) * neko.speed;
        if (ndx > 0.5) neko.facing = 1;
        if (ndx < -0.5) neko.facing = -1;
        neko.animTimer++;
        if (neko.animTimer > 14) {
          neko.animTimer = 0;
          neko.frame = (neko.frame === NEKO_WALK[0]) ? NEKO_WALK[1] : NEKO_WALK[0];
        }
      } else {
        neko.frame = NEKO_IDLE;
      }
    }

    // ===== HELPERS =====
    function shadeColor(hex, amt) {
      const num = parseInt(hex.replace('#', ''), 16);
      let r = Math.max(0, Math.min(255, (num >> 16) + amt));
      let g = Math.max(0, Math.min(255, ((num >> 8) & 0xFF) + amt));
      let b = Math.max(0, Math.min(255, (num & 0xFF) + amt));
      return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
    }

    function drawDoor(x, y, w, h) {
      ctx.fillStyle = '#3d2914'; ctx.fillRect(x-5, y-5, w+10, h+10);
      ctx.fillStyle = '#8B4513'; ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = '#5c3317'; ctx.lineWidth = 2;
      ctx.strokeRect(x+8, y+10, w-16, h/2-16);
      ctx.strokeRect(x+8, y+h/2+6, w-16, h/2-18);
      ctx.fillStyle = '#d4af37';
      ctx.beginPath(); ctx.arc(x+w-14, y+h/2, 6, 0, Math.PI*2); ctx.fill();
    }

    function drawShopDoor(doorX, doorY, frameColor) {
      ctx.fillStyle = frameColor; ctx.fillRect(doorX, doorY, 50, 70);
      ctx.fillStyle = shadeColor(frameColor, -15); ctx.fillRect(doorX+4, doorY+4, 42, 62);
      ctx.fillStyle = '#e8d97a';
      ctx.beginPath(); ctx.arc(doorX+38, doorY+35, 3, 0, Math.PI*2); ctx.fill();
    }

    function drawStreetSign(x, y, text) {
      ctx.fillStyle = '#2a2218';
      ctx.fillRect(x - 4, y - 4, 98, 36);
      ctx.fillStyle = '#3d3226';
      ctx.fillRect(x, y, 90, 28);
      ctx.strokeStyle = '#e8c94a';
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, 90, 28);
      ctx.fillStyle = '#2a2218';
      ctx.fillRect(x + 40, y + 28, 10, 12);
      ctx.fillStyle = '#e8c94a';
      ctx.font = 'bold 12px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText(text, x + 45, y + 19);
      ctx.textAlign = 'left';
    }

    // Crop source rects on the 1×2 prop sheet (left bike+GARAGE, right bench+MAIN STREET)
    function streetPropSource(which) {
      if (!streetPropsArt.complete || !streetPropsArt.naturalWidth) return null;
      const iw = streetPropsArt.naturalWidth;
      const ih = streetPropsArt.naturalHeight;
      if (which === 'bike') {
        return {
          sx: Math.floor(iw * 0.02),
          sy: Math.floor(ih * 0.12),
          sw: Math.floor(iw * 0.48),
          sh: Math.floor(ih * 0.70)
        };
      }
      return {
        sx: Math.floor(iw * 0.50),
        sy: Math.floor(ih * 0.12),
        sw: Math.floor(iw * 0.48),
        sh: Math.floor(ih * 0.74)
      };
    }

    // Draw prop art into a box (contain, bottom-aligned).
    // Direct drawImage only — no getImageData (that throws under file:// and was
    // aborting the whole frame, which made characters vanish on street scenes).
    function drawStreetPropArt(which, x, y, w, h) {
      try {
        const src = streetPropSource(which);
        if (!src || src.sw < 8 || src.sh < 8) return false;
        const ir = src.sw / src.sh;
        const tr = w / h;
        let dw, dh;
        if (ir > tr) {
          dw = w;
          dh = w / ir;
        } else {
          dh = h;
          dw = h * ir;
        }
        const dx = x + (w - dw) / 2;
        const dy = y + (h - dh);
        ctx.drawImage(
          streetPropsArt,
          src.sx, src.sy, src.sw, src.sh,
          dx, dy, dw, dh
        );
        return true;
      } catch (err) {
        console.warn('Street prop draw failed:', err && err.message);
        return false;
      }
    }

    // Sign + glowing zone drawn ON the door hitbox so the click target is obvious
    // prop: null | 'bike' | 'bench' — sheet art includes its own sign when available
    function drawTravelMarker(x, y, w, h, text, prop) {
      // Soft gold pad over the whole clickable area
      ctx.fillStyle = 'rgba(232, 201, 74, 0.14)';
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = 'rgba(232, 201, 74, 0.75)';
      ctx.lineWidth = 2;
      ctx.setLineDash([7, 5]);
      ctx.strokeRect(x + 3, y + 3, w - 6, h - 6);
      ctx.setLineDash([]);

      // Prefer sheet art (already has GARAGE / MAIN STREET sign)
      if (prop === 'bike' || prop === 'bench') {
        let drawn = false;
        try {
          drawn = drawStreetPropArt(prop, x + 2, y + 2, w - 4, h - 4);
        } catch (e) {
          drawn = false;
        }
        if (drawn) return;
      }

      // Fallback: procedural sign + prop (always works)
      const signW = Math.min(90, w - 4);
      const sx = Math.floor(x + (w - signW) / 2);
      const sy = Math.floor(y + 8);
      drawStreetSign(sx, sy, text);

      const groundY = y + h - 6;
      if (prop === 'bike') {
        drawBike(x + Math.floor((w - 62) / 2), groundY);
      } else if (prop === 'bench') {
        drawParkBench(x + 8, groundY, w - 16);
      }
    }

    // Street bike — procedural fallback if prop sheet not loaded
    function drawBike(x, groundY) {
      // soft shadow
      ctx.fillStyle = 'rgba(0,0,0,0.28)';
      ctx.beginPath();
      ctx.ellipse(x + 30, groundY + 2, 28, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      // wheels
      ctx.strokeStyle = '#1a1a1a';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(x + 12, groundY - 2, 12, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(x + 50, groundY - 2, 12, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = '#6a6a62';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(x + 12, groundY - 2, 6, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(x + 50, groundY - 2, 6, 0, Math.PI * 2); ctx.stroke();

      // frame (rust orange)
      ctx.strokeStyle = '#c45c26';
      ctx.lineWidth = 3;
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(x + 12, groundY - 2);
      ctx.lineTo(x + 28, groundY - 28);
      ctx.lineTo(x + 44, groundY - 12);
      ctx.lineTo(x + 50, groundY - 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x + 28, groundY - 28);
      ctx.lineTo(x + 18, groundY - 12);
      ctx.lineTo(x + 44, groundY - 12);
      ctx.stroke();

      // seat
      ctx.fillStyle = '#2a2a26';
      ctx.fillRect(x + 22, groundY - 32, 14, 5);
      // handlebars
      ctx.strokeStyle = '#3a3a36';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x + 44, groundY - 12);
      ctx.lineTo(x + 52, groundY - 30);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x + 46, groundY - 30);
      ctx.lineTo(x + 58, groundY - 28);
      ctx.stroke();
    }

    // Small concrete stairwell booth (outside clearing top level)
    function drawStairwellBooth(x, groundY) {
      const w = 78;
      const h = 96;

      // side depth (isometric-ish block)
      ctx.fillStyle = '#55554e';
      ctx.beginPath();
      ctx.moveTo(x + w, groundY - h);
      ctx.lineTo(x + w + 14, groundY - h + 10);
      ctx.lineTo(x + w + 14, groundY + 6);
      ctx.lineTo(x + w, groundY);
      ctx.closePath();
      ctx.fill();

      // main box
      ctx.fillStyle = '#6a6a62';
      ctx.fillRect(x, groundY - h, w, h);

      ctx.strokeStyle = 'rgba(30,30,25,0.25)';

      for (let sy = groundY - h + 18; sy < groundY - 10; sy += 22) {
        ctx.beginPath();
        ctx.moveTo(x + 4, sy);
        ctx.lineTo(x + w - 4, sy);

      ctx.fillStyle = '#3f3f38';

      // door recessed in face

      ctx.fillRect(x - 4, groundY - 2, w + 10, 10);

    function drawSword(cx, cy, angle, color) {
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(angle);
      ctx.fillStyle = color; ctx.fillRect(-3, -30, 6, 34);
      ctx.beginPath(); ctx.moveTo(-3,-30); ctx.lineTo(0,-38); ctx.lineTo(3,-30); ctx.fill();
      ctx.fillStyle = '#8a6a3a'; ctx.fillRect(-8, 3, 16, 4);

    // ===== EXTERIOR SHOPS =====
    // Draw image into a rect with cover-crop (preserve aspect, fill box)
    function drawImageCover(img, dx, dy, dw, dh, focusX, focusY) {
      if (!img || !img.complete || !img.naturalWidth) return false;
      const iw = img.naturalWidth, ih = img.naturalHeight;
      const ir = iw / ih, tr = dw / dh;
      let sx, sy, sw, sh;
      if (ir > tr) {
        sh = ih;
        sw = sh * tr;
        const fx = focusX == null ? 0.5 : focusX;
        sx = Math.max(0, Math.min(iw - sw, iw * fx - sw / 2));
        sy = 0;
      } else {
        sw = iw;
        sh = sw / tr;
        const fy = focusY == null ? 0.5 : focusY;
        sx = 0;
        sy = Math.max(0, Math.min(ih - sh, ih * fy - sh / 2));
      }
      ctx.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh);
      return true;
    }

    function drawWeaponStore(x, groundY, w, h) {

        ctx.fillStyle = '#3d2818'; ctx.fillRect(x + 10, y + 14, w - 20, 24);

    // ===== BROKEN BUILDING + GARAGE =====
    function drawBrokenBuilding(x, groundY, w, h) {
      const y = groundY - h;
      ctx.fillStyle = '#6b6558'; ctx.fillRect(x, y, w, h);
      ctx.fillStyle = 'rgba(40,38,32,0.25)';
      for (let i = 0; i < 4; i++) {
        const sx = x + 10 + i * (w / 4);
        ctx.fillRect(sx, y, 6, h * (0.4 + (i%3)*0.15));
      }
      ctx.fillStyle = shadeColor('#6b6558', -25);
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + w*0.2, y-10);
      ctx.lineTo(x + w*0.35, y);
      ctx.lineTo(x + w*0.55, y-14);
      ctx.lineTo(x + w*0.7, y);
      ctx.lineTo(x + w*0.9, y-6);
      ctx.lineTo(x + w, y);
      ctx.closePath(); ctx.fill();

      const winW = 16, winH = 20, padX = 14, padY = 18;
      let boardToggle = 0;
      for (let wy = y + padY + 8; wy < y + h - winH; wy += winH + padY) {
        for (let wx = x + padX; wx < x + w - winW; wx += winW + padX) {
          if (boardToggle % 3 === 0) {
            ctx.fillStyle = '#3d3226'; ctx.fillRect(wx, wy, winW, winH);
            ctx.strokeStyle = '#8a6a3a'; ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(wx, wy); ctx.lineTo(wx+winW, wy+winH);
            ctx.moveTo(wx+winW, wy); ctx.lineTo(wx, wy+winH);
            ctx.stroke();
          } else {
            ctx.fillStyle = '#1a1a1a'; ctx.fillRect(wx, wy, winW, winH);
            ctx.strokeStyle = '#0a0a0a'; ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(wx + winW*0.3, wy);
            ctx.lineTo(wx + winW*0.5, wy + winH*0.5);
            ctx.lineTo(wx + winW*0.2, wy + winH);
            ctx.stroke();
          }
          boardToggle++;
        }
      }
      ctx.fillStyle = '#5a5548';
      ctx.beginPath(); ctx.ellipse(x + w*0.15, groundY, 20, 7, 0, 0, Math.PI*2); ctx.fill();
    }

    function drawParkingGarage(x, groundY, w, h) {
      const y = groundY - h;
      ctx.fillStyle = '#8a8a82'; ctx.fillRect(x, y, w, h);
      ctx.fillStyle = shadeColor('#8a8a82', -20); ctx.fillRect(x, y, w, 10);

      const levels = 3;
      const levelH = (h - 10) / levels;
      ctx.strokeStyle = '#5a5a52'; ctx.lineWidth = 4;
      for (let i = 1; i < levels; i++) {
        ctx.beginPath();
        ctx.moveTo(x, y + 10 + levelH * i);
        ctx.lineTo(x + w, y + 10 + levelH * i);
        ctx.stroke();
      }

      ctx.fillStyle = '#3a3a36';
      for (let lvl = 0; lvl < levels; lvl++) {
        const ly = y + 10 + levelH * lvl + 8;

        const colCount = 4;
        const colW = (w - 20) / colCount - 8;
        for (let c = 0; c < colCount; c++) {
          const cx = x + 10 + c * ((w - 20) / colCount);
          ctx.fillRect(cx, ly, colW, openH);
        }
      }

      ctx.fillStyle = '#2a2a26'; ctx.fillRect(x + w/2 - 55, y - 22, 110, 18);
      ctx.fillStyle = '#e8c94a'; ctx.font = 'bold 12px Courier New'; ctx.textAlign = 'center';
      ctx.fillText('PARKING', x + w/2, y - 8); ctx.textAlign = 'left';

      ctx.fillStyle = '#1a1a1a'; ctx.fillRect(x + w - 85, groundY - 80, 75, 80);
      ctx.strokeStyle = '#5a5a52'; ctx.lineWidth = 3;
      ctx.strokeRect(x + w - 85, groundY - 80, 75, 80);
      ctx.fillStyle = '#e8c94a'; ctx.fillRect(x + w - 85, groundY - 6, 75, 6);

    // Draw car from the car_sheet.png (0=red Flare, 1=black Shadow, 2=van)
    // Source rects measured from car_sheet.png top-row 3/4 views (full vehicles, no side/ortho cuts)
    function drawCarSprite(x, groundY, which, scale) {
      if (!carSheet.complete || carSheet.naturalWidth === 0) return;

      const srcs = [
        { sx: 50,  sy: 120, sw: 410, sh: 255 }, // red Flare Civic
        { sx: 490, sy: 170, sw: 390, sh: 245 }, // black Shadow GT-R
        { sx: 900, sy: 70,  sw: 420, sh: 340 }  // Whiskers van (ears + roof rack)
      ];
      const s = srcs[which] || srcs[0];
      // Clamp to sheet bounds so crops never spill into neighboring art
      const maxW = carSheet.naturalWidth;
      const maxH = carSheet.naturalHeight;
      const sx = Math.max(0, Math.min(s.sx, maxW - 1));
      const sy = Math.max(0, Math.min(s.sy, maxH - 1));
      const sw = Math.min(s.sw, maxW - sx);
      const sh = Math.min(s.sh, maxH - sy);

      const dw = sw * scale;
      const dh = sh * scale;

      // soft shadow under tires
      ctx.fillStyle = 'rgba(0,0,0,0.32)';
      ctx.beginPath();
      ctx.ellipse(x + dw * 0.48, groundY + 4, dw * 0.42, 9, 0, 0, Math.PI * 2);
      ctx.fill();

      // Align bottom of sprite to ground (small lift so tires sit on the pavement)
      ctx.drawImage(carSheet, sx, sy, sw, sh, x, groundY - dh + 8, dw, dh);
    }

    function drawForestPath(variant) {
      const W = canvas.width, H = canvas.height;
      const palettes = [
        { sky0: '#1a3028', sky1: '#0a1810', ground: '#2a3a28', accent: '#6dff9a', name: 'Moss' },
        { sky0: '#1a2838', sky1: '#0a1218', ground: '#243038', accent: '#80e0ff', name: 'Creek' },
        { sky0: '#243018', sky1: '#101808', ground: '#3a3a20', accent: '#c8e060', name: 'Grove' },
        { sky0: '#2a2038', sky1: '#120e18', ground: '#2a2430', accent: '#e0a0ff', name: 'Hollow' },
        { sky0: '#0e1a14', sky1: '#060c08', ground: '#1a2418', accent: '#50a070', name: 'Thicket' }
      ];
      const p = palettes[variant] || palettes[0];

      const sky = ctx.createLinearGradient(0, 0, 0, H);
      sky.addColorStop(0, p.sky0);
      sky.addColorStop(1, p.sky1);
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, W, H);

      // Tree trunks
      for (let i = 0; i < 8; i++) {
        const tx = 30 + i * 80 + (i % 2) * 20;
        ctx.fillStyle = '#1a1208';
        ctx.fillRect(tx, 40, 18 + (i % 3) * 4, H * 0.7);
        ctx.fillStyle = p.sky0;
        ctx.beginPath();
        ctx.arc(tx + 10, 80 + (i % 4) * 30, 40 + (i % 3) * 10, 0, Math.PI * 2);
        ctx.fill();
      }

      // Path
      ctx.fillStyle = p.ground;
      ctx.beginPath();
      ctx.moveTo(W * 0.25, H);
      ctx.lineTo(W * 0.4, H * 0.55);
      ctx.lineTo(W * 0.6, H * 0.55);
      ctx.lineTo(W * 0.75, H);
      ctx.closePath();
      ctx.fill();

      // Accents
      ctx.fillStyle = p.accent;
      ctx.globalAlpha = 0.35;
      for (let i = 0; i < 12; i++) {
        ctx.beginPath();
        ctx.arc(60 + i * 50, 100 + (i % 5) * 40, 3, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fillRect(W / 2 - 120, 16, 240, 32);
      ctx.fillStyle = p.accent;
      ctx.font = 'bold 14px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText(rooms[currentRoom].name, W / 2, 38);
      ctx.textAlign = 'left';

      drawForestExitPad();
      ctx.fillStyle = '#7dffb0';
      ctx.font = 'bold 12px Courier New';
      ctx.fillText('◄ Crossroads', 18, 358);
    }

    function drawDreamcore() {
      const W = canvas.width, H = canvas.height;

      // Surreal gradient sky
      const sky = ctx.createLinearGradient(0, 0, W, H);
      sky.addColorStop(0, '#1a1040');
      sky.addColorStop(0.4, '#3a2060');
      sky.addColorStop(0.7, '#e080c0');
      sky.addColorStop(1, '#80c0e8');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, W, H);

      // Checker floor fading into void
      const tile = 40;
      for (let y = Math.floor(H * 0.55); y < H; y += tile) {
        for (let x = 0; x < W; x += tile) {
          const fade = (y - H * 0.55) / (H * 0.45);
          const on = ((x / tile) + (y / tile)) % 2 === 0;
          ctx.fillStyle = on
            ? 'rgba(255,255,255,' + (0.15 + fade * 0.25) + ')'
            : 'rgba(40,20,60,' + (0.35 + fade * 0.4) + ')';
          ctx.fillRect(x, y, tile, tile);
        }
      }

      // Floating islands / blobs
      ctx.fillStyle = 'rgba(200,160,255,0.35)';
      ctx.beginPath(); ctx.ellipse(120, 140, 70, 28, -0.3, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(500, 100, 90, 34, 0.2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,180,220,0.3)';
      ctx.beginPath(); ctx.ellipse(320, 180, 100, 26, 0, 0, Math.PI * 2); ctx.fill();

      // Giant moon / orb
      const orb = ctx.createRadialGradient(480, 80, 10, 480, 80, 90);
      orb.addColorStop(0, 'rgba(255,255,255,0.9)');
      orb.addColorStop(0.4, 'rgba(200,180,255,0.5)');
      orb.addColorStop(1, 'rgba(100,60,160,0)');
      ctx.fillStyle = orb;
      ctx.beginPath();
      ctx.arc(480, 80, 90, 0, Math.PI * 2);
      ctx.fill();

      // Doorways that go nowhere (dream vibe)
      ctx.fillStyle = 'rgba(20,10,40,0.7)';
      ctx.fillRect(80, 220, 50, 90);
      ctx.fillRect(520, 200, 50, 100);
      ctx.strokeStyle = 'rgba(200,160,255,0.6)';
      ctx.lineWidth = 2;
      ctx.strokeRect(80, 220, 50, 90);
      ctx.strokeRect(520, 200, 50, 100);

      // Title
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(W / 2 - 110, 14, 220, 34);
      ctx.fillStyle = '#e0c0ff';
      ctx.font = 'bold 16px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText('Dreamcore Limbo', W / 2, 38);
      ctx.font = '11px Courier New';
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.fillText('time feels soft here…', W / 2, 70);
      ctx.textAlign = 'left';

      drawForestExitPad();
      ctx.fillStyle = '#c9a0ff';
      ctx.font = 'bold 12px Courier New';
      ctx.fillText('◄ Roof', 32, 358);
    }

    function drawTrainingDummy(cx, groundY) {
      // post
      ctx.fillStyle = '#5a4030';
      ctx.fillRect(cx - 6, groundY - 90, 12, 90);
      // torso bag
      ctx.fillStyle = '#8a6a4a';
      ctx.beginPath();
      ctx.ellipse(cx, groundY - 100, 22, 36, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#6a4a30';
      ctx.beginPath();
      ctx.ellipse(cx, groundY - 100, 14, 28, 0, 0, Math.PI * 2);
      ctx.fill();
      // head
      ctx.fillStyle = '#c4a070';
      ctx.beginPath();
      ctx.arc(cx, groundY - 145, 16, 0, Math.PI * 2);
      ctx.fill();
      // X face
      ctx.strokeStyle = '#3a2a1a';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx - 6, groundY - 150);
      ctx.lineTo(cx + 6, groundY - 140);
      ctx.moveTo(cx + 6, groundY - 150);
      ctx.lineTo(cx - 6, groundY - 140);
      ctx.stroke();
      // arms / crossbar
      ctx.strokeStyle = '#5a4030';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(cx - 30, groundY - 110);
      ctx.lineTo(cx + 30, groundY - 110);
      ctx.stroke();
      // base
      ctx.fillStyle = '#3a3028';
      ctx.fillRect(cx - 22, groundY - 8, 44, 10);
    }

    // Draw one forest enemy from dedicated sheets: 0 male, 1 female, 2 hound
    function drawCombatEnemy(artIndex, feetX, feetY, faceLeft) {
      const idx = ((artIndex % 3) + 3) % 3;
      const img = enemyArts[idx];
      let sprite = null;
      if (img && img.complete && img.naturalWidth) {
        const iw = img.naturalWidth;
        const ih = img.naturalHeight;
        // Full single-figure portrait — light inset, black bg keyed
        const sx = Math.floor(iw * 0.08);
        const sy = Math.floor(ih * 0.04);
        const sw = Math.floor(iw * 0.84);
        const sh = Math.floor(ih * 0.92);
        const key = 'enemy_art_v1_' + idx;
        sprite = getKeyedSprite(key, img, sx, sy, sw, sh);
        if (!sprite) {
          const c = document.createElement('canvas');
          c.width = sw; c.height = sh;
          c.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
          sprite = c;
          npcSpriteCache[key] = c;
        }
      }
      if (!sprite) {
        ctx.fillStyle = '#5a3a4a';
        ctx.fillRect(feetX - 22, feetY - 120, 44, 120);
        return { dw: 44, dh: 120, dy: feetY - 120 };
      }
      // Match party combat scale
      const fit = fitSpriteSize(sprite.width, sprite.height, 100, 170);
      const dw = fit.dw, dh = fit.dh;
      const dx = feetX - dw / 2;
      const dy = feetY - dh;
      ctx.fillStyle = 'rgba(0,0,0,0.28)';
      ctx.beginPath();
      ctx.ellipse(feetX, feetY - 2, dw * 0.28, 6, 0, 0, Math.PI * 2);
      ctx.fill();
      if (faceLeft) {
        ctx.save();
        ctx.translate(feetX, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(sprite, -dw / 2, dy, dw, dh);
        ctx.restore();
      } else {
        ctx.drawImage(sprite, dx, dy, dw, dh);
      }
      return { dw: dw, dh: dh, dy: dy };
    }

    // Build a black-keyed (transparent bg) crop of an image. Safe under file://.
    // Never throws — returns null on failure so callers can fall back.
    function getKeyedSprite(cacheKey, img, sx, sy, sw, sh) {
      if (npcSpriteCache[cacheKey]) return npcSpriteCache[cacheKey];
      if (!img || !img.complete || !img.naturalWidth) return null;
      if (sw < 4 || sh < 4) return null;
      try {
        const c = document.createElement('canvas');
        c.width = sw;
        c.height = sh;
        const cctx = c.getContext('2d', { willReadFrequently: true });
        cctx.drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
        try {
          const id = cctx.getImageData(0, 0, sw, sh);
          const d = id.data;
          for (let i = 0; i < d.length; i += 4) {
            // Pure / near-black sheet background only (leave dark clothing alone if not pure black)
            if (d[i] < 14 && d[i + 1] < 14 && d[i + 2] < 14) d[i + 3] = 0;
          }
          cctx.putImageData(id, 0, 0);
        } catch (e) {
          // file:// may block getImageData — still use unkeyed crop
        }
        npcSpriteCache[cacheKey] = c;
        return c;
      } catch (err) {
        console.warn('NPC sprite cache failed:', cacheKey, err && err.message);
        npcSpriteCache[cacheKey] = null;
        return null;
      }
    }

    // Draw a sprite canvas at feet position, Ani-height scaled
    function drawNpcSprite(sprite, feetX, feetY, label, labelColor, hitbox) {
      const aniDrawH = frameH * ani.scale;
      if (!sprite) {
        const fw = 50, fh = aniDrawH;
        if (hitbox) {
          hitbox.x = feetX - fw / 2;
          hitbox.y = feetY - fh;
          hitbox.w = fw;
          hitbox.h = fh;
        }
        ctx.fillStyle = 'rgba(40,30,25,0.75)';
        ctx.fillRect(feetX - fw / 2, feetY - fh, fw, fh);
        return;
      }
      const scale = aniDrawH / sprite.height;
      const dw = sprite.width * scale;
      const dh = sprite.height * scale;
      const dx = feetX - dw / 2;
      const dy = feetY - dh;

      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath();
      ctx.ellipse(feetX, feetY - 2, dw * 0.28, 8, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.drawImage(sprite, dx, dy, dw, dh);

      if (label) {
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.font = 'bold 11px Courier New';
        const tw = ctx.measureText(label).width;
        ctx.fillRect(feetX - tw / 2 - 6, dy - 22, tw + 12, 18);
        ctx.fillStyle = labelColor || '#7dffb0';
        ctx.textAlign = 'center';
        ctx.fillText(label, feetX, dy - 9);
        ctx.textAlign = 'left';
      }

      if (hitbox) {
        hitbox.x = dx;
        hitbox.y = dy;
        hitbox.w = dw;
        hitbox.h = dh;
      }
    }

        const sx = Math.floor((iw - sw) / 2);
        const sy = Math.floor(ih * 0.02);
        sprite = getKeyedSprite('bar_maiden', barMaidenArt, sx, sy, sw, sh);
        if (!sprite) {

          const c = document.createElement('canvas');
          c.width = sw; c.height = sh;

    // Rogue sheet is 2×2 poses (1408×768). Cell 0 = L3, cell 1 = L4.
    function drawGarageRogue(cellIndex, feetX, feetY, label, hitbox) {
      let sprite = null;
      if (rogueSheetArt.complete && rogueSheetArt.naturalWidth) {
        const iw = rogueSheetArt.naturalWidth;
        const ih = rogueSheetArt.naturalHeight;
        const cols = 2, rows = 2;
        const cw = Math.floor(iw / cols);
        const ch = Math.floor(ih / rows);
        const col = cellIndex % cols;
        const row = Math.floor(cellIndex / cols);
        // Inset a little so gold frames/text are less likely
        const insetX = Math.floor(cw * 0.08);
        const insetY = Math.floor(ch * 0.06);
        const sx = col * cw + insetX;
        const sy = row * ch + insetY;
        const sw = cw - insetX * 2;
        const sh = ch - insetY * 2;
        const key = 'rogue_' + cellIndex;
        sprite = getKeyedSprite(key, rogueSheetArt, sx, sy, sw, sh);
        if (!sprite) {
          const c = document.createElement('canvas');
          c.width = sw; c.height = sh;
          c.getContext('2d').drawImage(rogueSheetArt, sx, sy, sw, sh, 0, 0, sw, sh);
          sprite = c;
          npcSpriteCache[key] = c;
        }
      }
      drawNpcSprite(sprite, feetX, feetY, label, '#c0a0e0', hitbox);
    }

    // Draw merchant at roughly Ani's on-screen size
    function drawWeaponMerchant() {
      const feetX = weaponNpcPos.feetX;
      const feetY = weaponNpcPos.feetY;
      // Match fox girl's drawn height
      const aniDrawH = frameH * ani.scale;

      if (!weaponPersonArt.complete || !weaponPersonArt.naturalWidth) {
        const fw = 50, fh = aniDrawH;
        weaponNpcHitbox.x = feetX - fw / 2;
        weaponNpcHitbox.y = feetY - fh;
        weaponNpcHitbox.w = fw;
        weaponNpcHitbox.h = fh;
        ctx.fillStyle = 'rgba(40,30,25,0.8)';
        ctx.fillRect(weaponNpcHitbox.x, weaponNpcHitbox.y, fw, fh);
        return;
      }

      const iw = weaponPersonArt.naturalWidth;
      const ih = weaponPersonArt.naturalHeight;
      const scale = aniDrawH / ih;
      const dw = iw * scale;
      const dh = ih * scale;
      const dx = feetX - dw / 2;
      const dy = feetY - dh;

      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath();

    function drawShopItemThumb(img, x, y, w, h) {
      ctx.fillStyle = '#0a0a0e';
      ctx.fillRect(x, y, w, h);
      if (img && img.complete && img.naturalWidth > 0) {
        const sc = Math.min((w - 8) / img.naturalWidth, (h - 8) / img.naturalHeight);
        const sw = img.naturalWidth * sc, sh = img.naturalHeight * sc;
        ctx.drawImage(img, x + (w - sw) / 2, y + (h - sh) / 2, sw, sh);
      }
    }

    // Crop chainmail (left) or potion (right) from the shared shop sheet
    function getShopSheetThumb(which) {
      const key = 'shop_' + which;
      if (npcSpriteCache[key]) return npcSpriteCache[key];
      if (!shopItemsSheet.complete || !shopItemsSheet.naturalWidth) return null;
      const iw = shopItemsSheet.naturalWidth;
      const ih = shopItemsSheet.naturalHeight;
      let sx, sy, sw, sh;
      if (which === 'chainmail') {
        sx = Math.floor(iw * 0.04);
        sy = Math.floor(ih * 0.04);
        sw = Math.floor(iw * 0.42);
        sh = Math.floor(ih * 0.55);
      } else {
        // potion bottle (right half)
        sx = Math.floor(iw * 0.52);
        sy = Math.floor(ih * 0.08);
        sw = Math.floor(iw * 0.30);
        sh = Math.floor(ih * 0.65);
      }
      const c = getKeyedSprite(key, shopItemsSheet, sx, sy, sw, sh);
      if (c) return c;
      // unkeyed fallback
      try {
        const off = document.createElement('canvas');
        off.width = sw; off.height = sh;
        off.getContext('2d').drawImage(shopItemsSheet, sx, sy, sw, sh, 0, 0, sw, sh);
        npcSpriteCache[key] = off;
        return off;
      } catch (e) {
        return null;
      }
    }

    function drawShopSheetThumb(which, x, y, w, h) {
      ctx.fillStyle = '#0a0a0e';
      ctx.fillRect(x, y, w, h);
      const sprite = getShopSheetThumb(which);
      if (sprite) {
        const sc = Math.min((w - 8) / sprite.width, (h - 8) / sprite.height);
        const sw = sprite.width * sc, sh = sprite.height * sc;
        ctx.drawImage(sprite, x + (w - sw) / 2, y + (h - sh) / 2, sw, sh);
      }
    }

        ctx.fillStyle = hpPct > 0.35 ? '#4c8' : '#e44';
        ctx.fillRect(x + 8, y + 24, (panelW - 16) * hpPct, 12);

        ctx.strokeRect(x + 8, y + 24, panelW - 16, 12);

        ctx.fillText('ATK ' + atk, x + 8, y + 54);
        ctx.fillStyle = '#7ab0ff';
        ctx.fillText('DEF ' + def, x + 80, y + 54);

        const maxStat = 20;
        ctx.fillStyle = '#333';
        ctx.fillRect(x + 8, y + 62, 70, 8);
        ctx.fillStyle = '#e8c94a';
        ctx.fillRect(x + 8, y + 62, 70 * Math.min(1, atk / maxStat), 8);
        ctx.fillStyle = '#333';
        ctx.fillRect(x + 88, y + 62, 70, 8);
        ctx.fillStyle = '#7ab0ff';
        ctx.fillRect(x + 88, y + 62, 70 * Math.min(1, def / maxStat), 8);

        if (st.hp <= 0) {
          ctx.fillStyle = 'rgba(180,40,40,0.85)';
          ctx.fillRect(x + panelW - 40, y + 4, 34, 16);
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 10px Courier New';
          ctx.fillText('KO', x + panelW - 30, y + 15);
        }
      }
    }
