<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ani Adventure</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      color: #eee;
    }
    #gameCanvas {
      background: #2a2a3e;
      border: 3px solid #ff8800;
      image-rendering: pixelated;
      max-width: 100%;
    }
    .info {
      position: fixed;
      bottom: 12px;
      left: 0; right: 0;
      text-align: center;
      font-size: 13px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="640" height="480"></canvas>
  <div class="info" id="roomLabel">Ani's Room</div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const roomLabel = document.getElementById('roomLabel');

    // === ANI ===
    const sheet = new Image();
    sheet.src = 'ani_sheet.png?' + Date.now();
    let frameW = 512, frameH = 512;
    const IDLE_FRAME = 2, WALK_FRAMES = [0, 3];
    const off = document.createElement('canvas');
    const offCtx = off.getContext('2d');

    const ani = {
      x: 270, y: 160, targetX: 270, targetY: 160,
      speed: 2.8, facing: 1, frame: IDLE_FRAME, animTimer: 0, scale: 0.36
    };

    // === NEKO (black catgirl) ===
    const nekoSheet = new Image();
    nekoSheet.src = 'neko_sheet.png?' + Date.now();
    let nekoFrameW = 466, nekoFrameH = 768;
    const NEKO_IDLE = 1, NEKO_WALK = [0, 2];
    const nekoOff = document.createElement('canvas');
    const nekoOffCtx = nekoOff.getContext('2d');

    const neko = {
      x: 180, y: 170, targetX: 180, targetY: 170,
      speed: 2.5, facing: 1, frame: NEKO_IDLE, animTimer: 0, scale: 0.28
    };

    let currentRoom = 'room';
    let activeMenu = null; // null | 'map'

    // Clickable van hitbox in the clearing
    const vanHitbox = { x: 180, y: 340, w: 180, h: 70 };

    const rooms = {
      room: {
        name: "Ani's Room",
        doors: [{ x: 545, y: 110, w: 80, h: 170, target: 'hallway', spawnX: 90, spawnY: 160 }]
      },
      hallway: {
        name: 'Hallway',
        doors: [
          { x: 15, y: 110, w: 75, h: 170, target: 'room', spawnX: 480, spawnY: 160 },
          { x: 550, y: 110, w: 75, h: 170, target: 'outside', spawnX: 80, spawnY: 200 },
          { x: 270, y: 110, w: 100, h: 170, target: 'kitchen', spawnX: 300, spawnY: 180 }
        ]
      },
      kitchen: {
        name: 'Kitchen',
        doors: [{ x: 270, y: 380, w: 100, h: 70, target: 'hallway', spawnX: 300, spawnY: 140 }]
      },
      outside: {
        name: 'City Street',
        doors: [
          { x: 55, y: 190, w: 70, h: 90, target: 'hallway', spawnX: 500, spawnY: 160 },
          { x: 195, y: 194, w: 50, h: 70, target: 'weaponStore', spawnX: 120, spawnY: 220 },
          { x: 355, y: 194, w: 50, h: 70, target: 'clothingStore', spawnX: 120, spawnY: 220 },
          { x: 525, y: 194, w: 50, h: 70, target: 'bar', spawnX: 100, spawnY: 220 },
          { x: 600, y: 180, w: 40, h: 100, target: 'garageStreet', spawnX: 60, spawnY: 200 }
        ]
      },
      garageStreet: {
        name: 'Garage Street',
        doors: [
          { x: 20, y: 180, w: 50, h: 80, target: 'outside', spawnX: 560, spawnY: 200 },
          { x: 530, y: 184, w: 80, h: 80, target: 'parkingGarage', spawnX: 300, spawnY: 220 }
        ]
      },
      parkingGarage: {
        name: 'Parking Garage - Ground',
        doors: [
          { x: 20, y: 290, w: 50, h: 70, target: 'garageStreet', spawnX: 540, spawnY: 210 },
          { x: 480, y: 290, w: 50, h: 70, target: 'stairwell', spawnX: 140, spawnY: 350 },
          { x: 160, y: 250, w: 140, h: 110, target: 'parkingGarageLevel2', spawnX: 100, spawnY: 300 }
        ]
      },
      stairwell: {
        name: 'Stairwell',
        doors: [
          { x: 100, y: 370, w: 50, h: 70, target: 'parkingGarage', spawnX: 500, spawnY: 280 },
          { x: 420, y: 80, w: 50, h: 70, target: 'garageTopFloor', spawnX: 500, spawnY: 280 }
        ]
      },
      parkingGarageLevel2: {
        name: 'Parking Garage - Level 2',
        doors: [
          { x: 20, y: 290, w: 50, h: 70, target: 'parkingGarage', spawnX: 200, spawnY: 280 },
          { x: 380, y: 150, w: 240, h: 220, target: 'parkingGarageLevel3', spawnX: 300, spawnY: 300 }
        ]
      },
      parkingGarageLevel3: {
        name: 'Parking Garage - Level 3',
        doors: [
          { x: 50, y: 300, w: 80, h: 80, target: 'parkingGarageLevel2', spawnX: 100, spawnY: 280 }
        ]
      },
      garageTopFloor: {
        name: 'Parking Garage - Top Floor',
        doors: [
          { x: 480, y: 290, w: 50, h: 70, target: 'stairwell', spawnX: 430, spawnY: 120 },
          { x: 20, y: 290, w: 50, h: 70, target: 'clearing', spawnX: 100, spawnY: 300 }
        ]
      },
      clearing: {
        name: 'Outside Clearing',
        doors: [
          { x: 20, y: 200, w: 50, h: 70, target: 'garageTopFloor', spawnX: 80, spawnY: 280 }
        ]
      },
      weaponStore: {
        name: 'Weapon Store',
        doors: [{ x: 55, y: 220, w: 55, h: 80, target: 'outside', spawnX: 210, spawnY: 210 }]
      },
      clothingStore: {
        name: 'Clothing Store',
        doors: [{ x: 55, y: 220, w: 55, h: 80, target: 'outside', spawnX: 370, spawnY: 210 }]
      },
      bar: {
        name: 'The Bar',
        doors: [{ x: 35, y: 220, w: 55, h: 80, target: 'outside', spawnX: 540, spawnY: 210 }]
      }
    };

    sheet.onload = () => {
      frameW = sheet.width / 2;
      frameH = sheet.height / 2;
      off.width = frameW; off.height = frameH;
      requestAnimationFrame(loop);
    };

    nekoSheet.onload = () => {
      nekoFrameW = Math.floor(nekoSheet.width / 3);
      nekoFrameH = nekoSheet.height;
      nekoOff.width = nekoFrameW;
      nekoOff.height = nekoFrameH;
    };

    function getCleanFrame(frameIndex) {
      const col = frameIndex % 2, row = Math.floor(frameIndex / 2);
      offCtx.clearRect(0, 0, frameW, frameH);
      offCtx.drawImage(sheet, col * frameW, row * frameH, frameW, frameH, 0, 0, frameW, frameH);
      const imgData = offCtx.getImageData(0, 0, frameW, frameH);
      const data = imgData.data;
      for (let i = 0; i < data.length; i += 4) {
        if (data[i] > 230 && data[i+1] > 230 && data[i+2] > 230) data[i+3] = 0;
      }
      offCtx.putImageData(imgData, 0, 0);
      return off;
    }

    function getCleanNekoFrame(frameIndex) {
      nekoOffCtx.clearRect(0, 0, nekoFrameW, nekoFrameH);
      nekoOffCtx.drawImage(nekoSheet, frameIndex * nekoFrameW, 0, nekoFrameW, nekoFrameH, 0, 0, nekoFrameW, nekoFrameH);
      const imgData = nekoOffCtx.getImageData(0, 0, nekoFrameW, nekoFrameH);
      const data = imgData.data;
      for (let i = 0; i < data.length; i += 4) {
        if (data[i] > 220 && data[i+1] > 220 && data[i+2] > 220) data[i+3] = 0;
        else if (data[i] > 200 && data[i+1] > 200 && data[i+2] > 190 && Math.abs(data[i]-data[i+1]) < 20) data[i+3] = 0;
      }
      nekoOffCtx.putImageData(imgData, 0, 0);
      return nekoOff;
    }

    function changeRoom(target, spawnX, spawnY) {
      currentRoom = target;
      activeMenu = null;
      ani.x = spawnX; ani.y = spawnY;
      ani.targetX = spawnX; ani.targetY = spawnY;
      neko.x = spawnX - 90;
      neko.y = spawnY + 10;
      neko.targetX = neko.x;
      neko.targetY = neko.y;
      roomLabel.textContent = rooms[currentRoom].name;
    }

    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
      const my = (e.clientY - rect.top) * (canvas.height / rect.height);

      // If a menu is open, handle menu clicks first
      if (activeMenu === 'map') {
        // Close button (top right of map panel)
        if (mx >= 520 && mx <= 555 && my >= 55 && my <= 90) {
          activeMenu = null;
          return;
        }
        // Clicking outside the map panel also closes it
        if (mx < 80 || mx > 560 || my < 50 || my > 430) {
          activeMenu = null;
          return;
        }
        // Future: clickable map locations go here
        return;
      }

      // Van click in clearing
      if (currentRoom === 'clearing') {
        if (mx >= vanHitbox.x && mx <= vanHitbox.x + vanHitbox.w &&
            my >= vanHitbox.y && my <= vanHitbox.y + vanHitbox.h) {
          activeMenu = 'map';
          return;
        }
      }

      // Normal door clicks
      for (const d of rooms[currentRoom].doors) {
        if (mx >= d.x && mx <= d.x + d.w && my >= d.y && my <= d.y + d.h) {
          changeRoom(d.target, d.spawnX, d.spawnY);
          return;
        }
      }

      // Walk to clicked position
      ani.targetX = mx - (frameW * ani.scale) / 2;
      ani.targetY = Math.min(Math.max(my - (frameH * ani.scale) * 0.65, 30), 300);
    });

    function update() {
      if (activeMenu) return; // freeze movement while menu is open

      const dx = ani.targetX - ani.x, dy = ani.targetY - ani.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist > 3) {
        ani.x += (dx / dist) * ani.speed;
        ani.y += (dy / dist) * ani.speed;
        if (dx > 0.5) ani.facing = 1;
        if (dx < -0.5) ani.facing = -1;
        ani.animTimer++;
        if (ani.animTimer > 12) {
          ani.animTimer = 0;
          ani.frame = (ani.frame === WALK_FRAMES[0]) ? WALK_FRAMES[1] : WALK_FRAMES[0];
        }
      } else {
        ani.frame = IDLE_FRAME;
        ani.x = ani.targetX; ani.y = ani.targetY;
      }

      const ndx = (ani.x - 85) - neko.x;
      const ndy = (ani.y + 8) - neko.y;
      const ndist = Math.sqrt(ndx*ndx + ndy*ndy);
      if (ndist > 35) {
        neko.x += (ndx / ndist) * neko.speed;
        neko.y += (ndy / ndist) * neko.speed;
        if (ndx > 0.5) neko.facing = 1;
        if (ndx < -0.5) neko.facing = -1;
        neko.animTimer++;
        if (neko.animTimer > 14) {
          neko.animTimer = 0;
          neko.frame = (neko.frame === NEKO_WALK[0]) ? NEKO_WALK[1] : NEKO_WALK[0];
        }
      } else {
        neko.frame = NEKO_IDLE;
      }
    }

    // ===== HELPERS =====
    function shadeColor(hex, amt) {
      const num = parseInt(hex.replace('#', ''), 16);
      let r = Math.max(0, Math.min(255, (num >> 16) + amt));
      let g = Math.max(0, Math.min(255, ((num >> 8) & 0xFF) + amt));
      let b = Math.max(0, Math.min(255, (num & 0xFF) + amt));
      return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
    }

    function drawDoor(x, y, w, h) {
      ctx.fillStyle = '#3d2914'; ctx.fillRect(x-5, y-5, w+10, h+10);
      ctx.fillStyle = '#8B4513'; ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = '#5c3317'; ctx.lineWidth = 2;
      ctx.strokeRect(x+8, y+10, w-16, h/2-16);
      ctx.strokeRect(x+8, y+h/2+6, w-16, h/2-18);
      ctx.fillStyle = '#d4af37';
      ctx.beginPath(); ctx.arc(x+w-14, y+h/2, 6, 0, Math.PI*2); ctx.fill();
    }

    function drawShopDoor(doorX, doorY, frameColor) {
      ctx.fillStyle = frameColor; ctx.fillRect(doorX, doorY, 50, 70);
      ctx.fillStyle = shadeColor(frameColor, -15); ctx.fillRect(doorX+4, doorY+4, 42, 62);
      ctx.fillStyle = '#e8d97a';
      ctx.beginPath(); ctx.arc(doorX+38, doorY+35, 3, 0, Math.PI*2); ctx.fill();
    }

    function drawStreetSign(x, y, text) {
      ctx.fillStyle = '#2a2218';
      ctx.fillRect(x - 4, y - 4, 98, 36);
      ctx.fillStyle = '#3d3226';
      ctx.fillRect(x, y, 90, 28);
      ctx.strokeStyle = '#e8c94a';
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, 90, 28);
      ctx.fillStyle = '#2a2218';
      ctx.fillRect(x + 40, y + 28, 10, 12);
      ctx.fillStyle = '#e8c94a';
      ctx.font = 'bold 12px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText(text, x + 45, y + 19);
      ctx.textAlign = 'left';
    }

    function drawSword(cx, cy, angle, color) {
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(angle);
      ctx.fillStyle = color; ctx.fillRect(-3, -30, 6, 34);
      ctx.beginPath(); ctx.moveTo(-3,-30); ctx.lineTo(0,-38); ctx.lineTo(3,-30); ctx.fill();
      ctx.fillStyle = '#8a6a3a'; ctx.fillRect(-8, 3, 16, 4);
      ctx.fillStyle = '#5a3b28'; ctx.fillRect(-2, 6, 4, 12);
      ctx.restore();
    }

    function drawShirt(cx, cy, color) {
      ctx.strokeStyle = '#888'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(cx, cy-6); ctx.lineTo(cx, cy); ctx.stroke();
      ctx.fillStyle = color;
      ctx.fillRect(cx-6, cy, 12, 14); ctx.fillRect(cx-10, cy, 4, 8); ctx.fillRect(cx+6, cy, 4, 8);
    }

    function drawBarrel(cx, cy) {
      ctx.fillStyle = '#8a6a3a'; ctx.fillRect(cx-10, cy, 20, 22);
      ctx.strokeStyle = '#4a3a2a'; ctx.lineWidth = 2;
      ctx.strokeRect(cx-10, cy+4, 20, 3); ctx.strokeRect(cx-10, cy+15, 20, 3);
    }

    function drawCounter(x, y, w, h, color) {
      ctx.fillStyle = color; ctx.fillRect(x, y, w, h);
      ctx.fillStyle = shadeColor(color, 20); ctx.fillRect(x, y, w, 10);
      ctx.strokeStyle = shadeColor(color, -20); ctx.lineWidth = 2; ctx.strokeRect(x, y, w, h);
    }

    function drawBook(x, y) {
      ctx.fillStyle = '#8a3a3a'; ctx.fillRect(x, y, 26, 18);
      ctx.fillStyle = '#e8d9c9'; ctx.fillRect(x+2, y+2, 22, 3);
      ctx.strokeStyle = '#5a2020'; ctx.lineWidth = 1; ctx.strokeRect(x, y, 26, 18);
    }

    function drawSwordFlat(x, y, len, color) {
      ctx.fillStyle = color; ctx.fillRect(x, y, len-20, 5);
      ctx.beginPath(); ctx.moveTo(x+len-20, y); ctx.lineTo(x+len-12, y+2.5); ctx.lineTo(x+len-20, y+5); ctx.fill();
      ctx.fillStyle = '#8a6a3a'; ctx.fillRect(x-4, y-4, 4, 13);
      ctx.fillStyle = '#5a3b28'; ctx.fillRect(x-16, y-1, 12, 7);
    }

    function drawShelfWithSwords(x, y, w, h) {
      ctx.fillStyle = '#3d2818'; ctx.fillRect(x, y, w, h);
      ctx.fillStyle = '#5a3b28'; ctx.fillRect(x+6, y+6, w-12, h-12);
      const rowH = (h-20)/2;
      ctx.fillStyle = '#3d2818'; ctx.fillRect(x+6, y+10+rowH, w-12, 4);
      drawSwordFlat(x+20, y + rowH*0.5 + 6, w-40, '#c9c9d0');
      drawSwordFlat(x+20, y + rowH*1.5 + 12, w-40, '#d4af6a');
    }

    function drawClothingRack(x, y, w) {
      ctx.strokeStyle = '#3d2818'; ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(x, y); ctx.lineTo(x, y+90);
      ctx.moveTo(x+w, y); ctx.lineTo(x+w, y+90);
      ctx.moveTo(x, y); ctx.lineTo(x+w, y); ctx.stroke();
      const colors = ['#d9556b','#5a8fc9','#e8c94a','#7ac98f','#a86bc9'];
      const spacing = w / 6;
      for (let i = 0; i < 6; i++) drawShirt(x + spacing*i + spacing/2, y+6, colors[i%5]);
    }

    function drawBottle(x, bottomY, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x, bottomY-26, 8, 26);
      ctx.fillRect(x+2, bottomY-32, 4, 6);
    }

    function drawBottleShelf(x, y, w) {
      ctx.fillStyle = '#5a3b28';
      ctx.fillRect(x, y+40, w, 6); ctx.fillRect(x, y+80, w, 6);
      const colors = ['#4a7a4a','#7a3a3a','#4a5a8a','#8a7a3a'];
      for (let row = 0; row < 2; row++) {
        for (let i = 0; i < 7; i++) drawBottle(x + 10 + i*(w/7), y + row*40 + 40, colors[(i+row)%4]);
      }
    }

    function drawChair(x, y) {
      ctx.fillStyle = '#4a3020'; ctx.fillRect(x-10, y-6, 20, 16);
      ctx.fillStyle = '#3d2818'; ctx.fillRect(x-10, y-20, 20, 8);
    }

    function drawTableAndChairs(x, y) {
      ctx.fillStyle = '#6a4a30';
      ctx.beginPath(); ctx.ellipse(x, y, 34, 18, 0, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#3d2818'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#3d2818'; ctx.fillRect(x-4, y+4, 8, 20);
      drawChair(x-50, y+10); drawChair(x+50, y+10); drawChair(x, y+40);
    }

    // ===== EXTERIOR SHOPS =====
    function drawWeaponStore(x, groundY, w, h) {
      const y = groundY - h;
      ctx.fillStyle = '#5a4a42'; ctx.fillRect(x, y, w, h);
      ctx.fillStyle = shadeColor('#5a4a42', -20); ctx.fillRect(x, y, w, 8);
      ctx.fillStyle = '#3d2818'; ctx.fillRect(x+10, y+14, w-20, 24);
      ctx.fillStyle = '#d9b25a'; ctx.font = '12px Courier New'; ctx.textAlign = 'center';
      ctx.fillText('WEAPONS', x+w/2, y+31); ctx.textAlign = 'left';
      ctx.fillStyle = '#e8d98b';
      ctx.fillRect(x+12, y+h-90, 18, 22); ctx.fillRect(x+w-30, y+h-90, 18, 22);
      drawSword(x+w/2-6, y+h-80, -0.5, '#c9c9d0');
      drawSword(x+w/2+6, y+h-80, 0.5, '#c9c9d0');
      drawShopDoor(x+w/2-25, groundY-70, '#3a2a20');
    }

    function drawClothingStore(x, groundY, w, h) {
      const y = groundY - h;
      ctx.fillStyle = '#a86b8a'; ctx.fillRect(x, y, w, h);
      ctx.fillStyle = shadeColor('#a86b8a', -20); ctx.fillRect(x, y, w, 8);
      const awningY = y + h - 96;
      ctx.fillStyle = '#e8d98b'; ctx.fillRect(x+8, awningY, w-16, 10);
      ctx.fillStyle = '#d9556b';
      for (let i = 0; i < w-16; i += 12) ctx.fillRect(x+8+i, awningY, 6, 10);
      ctx.fillStyle = '#f2f2ea';
      for (let i = 0; i < w-16; i += 12) {
        ctx.beginPath(); ctx.arc(x+8+i+6, awningY+10, 5, 0, Math.PI); ctx.fill();
      }
      ctx.fillStyle = '#cfe8ec'; ctx.fillRect(x+12, awningY+12, w-24, 40);
      drawShirt(x+24, awningY+20, '#d9556b');
      drawShirt(x+48, awningY+20, '#5a8fc9');
      drawShirt(x+72, awningY+20, '#e8c94a');
      ctx.fillStyle = '#3d2818'; ctx.font = '11px Courier New'; ctx.textAlign = 'center';
      ctx.fillText('CLOTHES', x+w/2, y+20); ctx.textAlign = 'left';
      drawShopDoor(x+w/2-25, groundY-70, '#7a4a5a');
    }

    function drawBarShop(x, groundY, w, h) {
      const y = groundY - h;
      ctx.fillStyle = '#4a3a2a'; ctx.fillRect(x, y, w, h);
      ctx.fillStyle = shadeColor('#4a3a2a', -20); ctx.fillRect(x, y, w, 8);
      ctx.fillStyle = '#f2c14a';
      ctx.fillRect(x+14, y+h-90, 20, 24); ctx.fillRect(x+w-34, y+h-90, 20, 24);
      ctx.strokeStyle = '#4a3a2a'; ctx.lineWidth = 2;
      [14, w-34].forEach(off => {
        ctx.beginPath();
        ctx.moveTo(x+off, y+h-78); ctx.lineTo(x+off+20, y+h-78);
        ctx.moveTo(x+off+10, y+h-90); ctx.lineTo(x+off+10, y+h-66); ctx.stroke();
      });
      ctx.strokeStyle = '#2a1f18'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(x+w/2, y+6); ctx.lineTo(x+w/2, y-10); ctx.stroke();
      ctx.fillStyle = '#2a1f18'; ctx.fillRect(x+w/2-30, y-26, 60, 20);
      ctx.fillStyle = '#e8c94a'; ctx.font = '11px Courier New'; ctx.textAlign = 'center';
      ctx.fillText('THE BAR', x+w/2, y-12); ctx.textAlign = 'left';
      drawBarrel(x+w/2-45, groundY-22); drawBarrel(x+w/2+33, groundY-22);
      drawShopDoor(x+w/2-25, groundY-70, '#2a1f18');
    }

    // ===== BROKEN BUILDING + GARAGE =====
    function drawBrokenBuilding(x, groundY, w, h) {
      const y = groundY - h;
      ctx.fillStyle = '#6b6558'; ctx.fillRect(x, y, w, h);
      ctx.fillStyle = 'rgba(40,38,32,0.25)';
      for (let i = 0; i < 4; i++) {
        const sx = x + 10 + i * (w / 4);
        ctx.fillRect(sx, y, 6, h * (0.4 + (i%3)*0.15));
      }
      ctx.fillStyle = shadeColor('#6b6558', -25);
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + w*0.2, y-10);
      ctx.lineTo(x + w*0.35, y);
      ctx.lineTo(x + w*0.55, y-14);
      ctx.lineTo(x + w*0.7, y);
      ctx.lineTo(x + w*0.9, y-6);
      ctx.lineTo(x + w, y);
      ctx.closePath(); ctx.fill();

      const winW = 16, winH = 20, padX = 14, padY = 18;
      let boardToggle = 0;
      for (let wy = y + padY + 8; wy < y + h - winH; wy += winH + padY) {
        for (let wx = x + padX; wx < x + w - winW; wx += winW + padX) {
          if (boardToggle % 3 === 0) {
            ctx.fillStyle = '#3d3226'; ctx.fillRect(wx, wy, winW, winH);
            ctx.strokeStyle = '#8a6a3a'; ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(wx, wy); ctx.lineTo(wx+winW, wy+winH);
            ctx.moveTo(wx+winW, wy); ctx.lineTo(wx, wy+winH);
            ctx.stroke();
          } else {
            ctx.fillStyle = '#1a1a1a'; ctx.fillRect(wx, wy, winW, winH);
            ctx.strokeStyle = '#0a0a0a'; ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(wx + winW*0.3, wy);
            ctx.lineTo(wx + winW*0.5, wy + winH*0.5);
            ctx.lineTo(wx + winW*0.2, wy + winH);
            ctx.stroke();
          }
          boardToggle++;
        }
      }
      ctx.fillStyle = '#5a5548';
      ctx.beginPath(); ctx.ellipse(x + w*0.15, groundY, 20, 7, 0, 0, Math.PI*2); ctx.fill();
    }

    function drawParkingGarage(x, groundY, w, h) {
      const y = groundY - h;
      ctx.fillStyle = '#8a8a82'; ctx.fillRect(x, y, w, h);
      ctx.fillStyle = shadeColor('#8a8a82', -20); ctx.fillRect(x, y, w, 10);

      const levels = 3;
      const levelH = (h - 10) / levels;
      ctx.strokeStyle = '#5a5a52'; ctx.lineWidth = 4;
      for (let i = 1; i < levels; i++) {
        ctx.beginPath();
        ctx.moveTo(x, y + 10 + levelH * i);
        ctx.lineTo(x + w, y + 10 + levelH * i);
        ctx.stroke();
      }

      ctx.fillStyle = '#3a3a36';
      for (let lvl = 0; lvl < levels; lvl++) {
        const ly = y + 10 + levelH * lvl + 8;
        const openH = levelH - 16;
        const colCount = 4;
        const colW = (w - 20) / colCount - 8;
        for (let c = 0; c < colCount; c++) {
          const cx = x + 10 + c * ((w - 20) / colCount);
          ctx.fillRect(cx, ly, colW, openH);
        }
      }

      ctx.fillStyle = '#2a2a26'; ctx.fillRect(x + w/2 - 55, y - 22, 110, 18);
      ctx.fillStyle = '#e8c94a'; ctx.font = 'bold 12px Courier New'; ctx.textAlign = 'center';
      ctx.fillText('PARKING', x + w/2, y - 8); ctx.textAlign = 'left';

      ctx.fillStyle = '#1a1a1a'; ctx.fillRect(x + w - 85, groundY - 80, 75, 80);
      ctx.strokeStyle = '#5a5a52'; ctx.lineWidth = 3;
      ctx.strokeRect(x + w - 85, groundY - 80, 75, 80);
      ctx.fillStyle = '#e8c94a'; ctx.fillRect(x + w - 85, groundY - 6, 75, 6);
    }

    // ===== DETAILED STAIRWELL =====
    function drawStairwellInterior() {
      const W = canvas.width;
      const H = canvas.height;

      ctx.fillStyle = '#5c5c54';
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = 'rgba(30,35,25,0.2)';
      for (let i = 0; i < 4; i++) {
        const sx = 40 + i * (W / 4);
        ctx.fillRect(sx, 0, 5, H * 0.4);
      }

      const stepCount = 10;
      const stepW = W * 0.5;
      const stepH = (H * 0.65) / stepCount;
      const baseX = W * 0.25;
      const baseY = H * 0.92;

      for (let i = 0; i < stepCount; i++) {
        const sx = baseX + i * 6;
        const sy = baseY - i * stepH;
        const sw = stepW - i * 12;

        ctx.fillStyle = '#8a8a80';
        ctx.fillRect(sx, sy - stepH, sw, stepH);
        ctx.fillStyle = '#4a4a42';
        ctx.fillRect(sx, sy - 6, sw, 6);
        ctx.fillStyle = 'rgba(255,255,255,0.05)';
        ctx.fillRect(sx, sy - stepH, sw, 3);
      }

      ctx.strokeStyle = '#3a3a34';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(baseX + stepW + 10, baseY);
      ctx.lineTo(baseX + stepCount * 6 + (stepW - stepCount * 12) + 10, baseY - stepCount * stepH);
      ctx.stroke();

      ctx.lineWidth = 3;
      for (let i = 0; i <= stepCount; i += 2) {
        const px = baseX + i * 6 + stepW - i * 12 + 10;
        const py = baseY - i * stepH;
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(px, py + 20);
        ctx.stroke();
      }

      ctx.strokeStyle = '#2a2a26';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(W * 0.5, 0);
      ctx.lineTo(W * 0.5, 40);
      ctx.stroke();
      ctx.fillStyle = '#f2e6a0';
      ctx.beginPath();
      ctx.arc(W * 0.5, 48, 8, 0, Math.PI * 2);
      ctx.fill();

      drawShopDoor(baseX - 60, baseY - 70, '#2a2a26');
      ctx.fillStyle = '#e8c94a';
      ctx.font = '12px Courier New';
      ctx.fillText('◄ Garage', baseX - 75, baseY - 78);

      const topX = baseX + stepCount * 6 + (stepW - stepCount * 12) - 30;
      const topY = baseY - stepCount * stepH;
      drawShopDoor(topX, topY - 70, '#2a2a26');
      ctx.fillStyle = '#e8c94a';
      ctx.fillText('Top Floor ►', topX - 10, topY - 78);
    }

    // ===== TOP FLOOR =====
    function drawGarageTopFloor() {
      const W = canvas.width;

      const wallGrad = ctx.createLinearGradient(0, 0, 0, H * 0.75);

      ctx.fillRect(0, 0, W, H * 0.75);

      ctx.fillStyle = 'rgba(30,35,25,0.2)';
      for (let i = 0; i < 6; i++) {
        const sx = 20 + i * (W / 6) + Math.sin(i) * 10;

        ctx.moveTo(sx, 0);
        ctx.lineTo(sx + 4, H * (0.3 + (i % 3) * 0.15));
        ctx.lineTo(sx - 4, H * (0.3 + (i % 3) * 0.15));
        ctx.closePath();
        ctx.fill();
      }

      ctx.fillStyle = '#8fa0b8';
      ctx.fillRect(0, 0, W, H * 0.12);

      ctx.fillStyle = '#3f3f38';
      for (let x = 40; x < W; x += 160) {
        ctx.fillRect(x, H * 0.12, 24, H * 0.05);
      }

      drawGaragePillar(180, H * 0.17, H * 0.58);

      ctx.fillStyle = '#7a7a70';
      ctx.fillRect(0, H * 0.75, W, H * 0.25);

      ctx.fillStyle = 'rgba(40,45,35,0.3)';
      drawPuddle(250, H * 0.85, 26, 8);
      drawPuddle(560, H * 0.9, 20, 6);

      ctx.strokeStyle = 'rgba(232,201,74,0.35)';
      ctx.lineWidth = 3;
      for (let x = 30; x < W; x += 130) {
        ctx.beginPath();
        ctx.moveTo(x, H * 0.78);
        ctx.lineTo(x, H);
        ctx.stroke();
      }

      ctx.fillStyle = '#5c5c54';
      ctx.fillRect(0, H * 0.66, W, 10);

      drawStairwell(W - 180, H * 0.75, 150, H * 0.55);

      drawShopDoor(20, H * 0.75 - 70, '#2a2a26');
      ctx.fillStyle = '#e8c94a';
      ctx.font = '12px Courier New';
      ctx.fillText('Outside ►', 5, H * 0.75 - 78);

    // ===== OUTSIDE CLEARING =====

      const W = canvas.width;

      const sky = ctx.createLinearGradient(0, 0, 0, H * 0.5);
      sky.addColorStop(0, '#8f9aab');

      ctx.fillStyle = '#4a4a48';
      ctx.fillRect(0, H * 0.5, W * 0.65, H * 0.5);

    function drawFaceDecal(cx, cy, color, type) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(cx, cy, 16, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      if (type === 'fox') {
        ctx.moveTo(cx - 14, cy - 10);
        ctx.lineTo(cx - 20, cy - 24);
        ctx.lineTo(cx - 6, cy - 16);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(cx + 14, cy - 10);
        ctx.lineTo(cx + 20, cy - 24);
        ctx.lineTo(cx + 6, cy - 16);
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.moveTo(cx - 12, cy - 12);
        ctx.lineTo(cx - 16, cy - 22);
        ctx.lineTo(cx - 4, cy - 16);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(cx + 12, cy - 12);
        ctx.lineTo(cx + 16, cy - 22);
        ctx.lineTo(cx + 4, cy - 16);
        ctx.closePath();
        ctx.fill();
      }

      ctx.fillStyle = '#1a1a1a';
      ctx.beginPath(); ctx.arc(cx - 6, cy - 2, 2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + 6, cy - 2, 2, 0, Math.PI * 2); ctx.fill();

      ctx.beginPath();
      ctx.moveTo(cx - 3, cy + 4);
      ctx.lineTo(cx + 3, cy + 4);
      ctx.lineTo(cx, cy + 8);
      ctx.closePath();
      ctx.fill();
    }

    // ===== MAP POPUP =====

      // Title

      // Close button
      ctx.fillStyle = '#5a3a3a';
      ctx.fillRect(520, 55, 35, 35);
      ctx.strokeStyle = '#e8c94a';
      ctx.lineWidth = 2;
      ctx.strokeRect(520, 55, 35, 35);
      ctx.fillStyle = '#e8c94a';
      ctx.font = 'bold 20px Courier New';
      ctx.fillText('X', 537, 80);

      // Placeholder locations
      ctx.fillStyle = '#3a3a34';

      ctx.fillRect(340, 130, 180, 100);

      ctx.fillRect(340, 260, 180, 100);

      ctx.strokeStyle = '#6a6a60';
      ctx.lineWidth = 2;

      ctx.strokeRect(340, 130, 180, 100);
      ctx.strokeRect(120, 260, 180, 100);
      ctx.strokeRect(340, 260, 180, 100);

      ctx.fillStyle = '#aaa';
      ctx.font = '14px Courier New';
      ctx.fillText('City Street', 210, 185);
      ctx.fillText('(Current Area)', 210, 205);

      ctx.fillText('Garage District', 430, 185);
      ctx.fillText('(Unlocked)', 430, 205);

      ctx.fillText('???', 210, 315);
      ctx.fillText('(Locked)', 210, 335);

      ctx.fillText('???', 430, 315);
      ctx.fillText('(Locked)', 430, 335);

      ctx.fillStyle = '#888';
      ctx.font = '12px Courier New';
      ctx.fillText('More locations coming soon...', 320, 400);

      ctx.textAlign = 'left';
    }

    // ===== ROOMS =====
    function drawRoom() {
      ctx.fillStyle = '#3d2b1f'; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = '#5c4033'; ctx.fillRect(0,0,canvas.width,250);
      ctx.strokeStyle = '#2a1a10'; ctx.lineWidth = 2;
      for (let y=250; y<canvas.height; y+=24) {
        ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke();
      }
      ctx.fillStyle = '#4a2c17'; ctx.fillRect(28,155,18,120);
      ctx.fillStyle = '#6b3e26'; ctx.fillRect(40,195,165,70);
      ctx.fillStyle = '#c45c26'; ctx.fillRect(55,200,140,55);
      ctx.fillStyle = '#e8d5b7'; ctx.fillRect(58,205,48,22);
      ctx.fillStyle = '#5c4033'; ctx.fillRect(400,150,120,130);
      ctx.fillStyle = '#7a5c45'; ctx.fillRect(395,145,130,12);
      drawDoor(545,110,80,170);
    }

    function drawHallway() {
      ctx.fillStyle = '#2c241b'; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = '#4a3b2f'; ctx.fillRect(0,0,canvas.width,250);
      ctx.strokeStyle = '#1a140e'; ctx.lineWidth = 2;
      for (let y=250; y<canvas.height; y+=22) {
        ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke();
      }
      ctx.fillStyle = '#3a2e24';
      ctx.fillRect(0,0,20,canvas.height); ctx.fillRect(620,0,20,canvas.height);
      drawDoor(15,110,75,170); drawDoor(550,110,75,170); drawDoor(270,110,100,170);
      ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.font = '12px Courier New';
      ctx.fillText('Kitchen', 290, 100); ctx.fillText('City', 570, 100);
    }

    function drawKitchen() {
      ctx.fillStyle = '#e8e8e8'; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.strokeStyle = '#c8c8c8'; ctx.lineWidth = 1;
      for (let x=0; x<canvas.width; x+=40) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke(); }
      for (let y=0; y<canvas.height; y+=40) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke(); }
      ctx.fillStyle = '#f5f5f5'; ctx.fillRect(0,0,canvas.width,220);
      ctx.fillStyle = '#d0d0d0'; ctx.fillRect(40,200,560,50);
      ctx.fillStyle = '#b0b0b0'; ctx.fillRect(40,245,560,18);
      ctx.fillStyle = '#333'; ctx.fillRect(80,175,110,30);
      ctx.fillStyle = '#222'; ctx.fillRect(90,160,40,20); ctx.fillRect(140,160,40,20);
      ctx.fillStyle = '#111';
      ctx.beginPath(); ctx.arc(110,170,12,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(160,170,12,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#aaa'; ctx.fillRect(280,185,90,25);
      ctx.fillStyle = '#888'; ctx.fillRect(290,190,70,15);
      ctx.fillStyle = '#666'; ctx.fillRect(320,170,10,20); ctx.fillRect(310,168,30,6);
      ctx.fillStyle = '#ddd'; ctx.fillRect(420,80,80,90); ctx.fillRect(510,80,80,90);
      drawDoor(270,380,100,70);
    }

    function drawCity() {
      const W = canvas.width, H = canvas.height, groundY = H * 0.55;
      const sky = ctx.createLinearGradient(0, 0, 0, groundY);
      sky.addColorStop(0, '#6b7fb0'); sky.addColorStop(1, '#c9a8c2');
      ctx.fillStyle = sky; ctx.fillRect(0, 0, W, groundY);
      ctx.fillStyle = '#9a9a92'; ctx.fillRect(0, groundY, W, H*0.23);
      ctx.strokeStyle = '#7d7d74'; ctx.lineWidth = 2;
      for (let x=0; x<W; x+=60) { ctx.beginPath(); ctx.moveTo(x,groundY); ctx.lineTo(x,H*0.78); ctx.stroke(); }
      ctx.fillStyle = '#3a3a42'; ctx.fillRect(0, H*0.78, W, H*0.22);
      ctx.fillStyle = '#e8d97a';
      for (let x=10; x<W; x+=50) ctx.fillRect(x, H*0.78+(H*0.22)/2-3, 30, 6);
      drawWeaponStore(160, groundY, 130, H*0.38);
      drawClothingStore(310, groundY, 140, H*0.34);
      drawBarShop(470, groundY, 140, H*0.36);
      drawDoor(55, 190, 70, 90);
      ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.font = '12px Courier New';
      ctx.fillText('◄ Hallway', 50, 180);
      drawStreetSign(540, 140, 'GARAGE →');
    }

    function drawGarageStreet() {
      const W = canvas.width, H = canvas.height, groundY = H * 0.55;
      const sky = ctx.createLinearGradient(0, 0, 0, groundY);
      sky.addColorStop(0, '#5a6b8a'); sky.addColorStop(1, '#a89aa0');
      ctx.fillStyle = sky; ctx.fillRect(0, 0, W, groundY);
      ctx.fillStyle = '#8f8f88'; ctx.fillRect(0, groundY, W, H*0.23);
      ctx.strokeStyle = '#727268'; ctx.lineWidth = 2;
      for (let x=0; x<W; x+=60) {
        ctx.beginPath(); ctx.moveTo(x, groundY); ctx.lineTo(x, H*0.78); ctx.stroke();
      }
      ctx.fillStyle = '#3a3a42'; ctx.fillRect(0, H*0.78, W, H*0.22);
      ctx.fillStyle = '#d9cb6a';
      for (let x=10; x<W; x+=50) ctx.fillRect(x, H*0.78+(H*0.22)/2-3, 30, 6);
      drawBrokenBuilding(20, groundY, 140, H*0.30);
      drawBrokenBuilding(180, groundY, 120, H*0.24);
      drawParkingGarage(380, groundY, 240, H*0.40);
      drawStreetSign(8, 155, '← CITY');
    }

    function drawParkingGarageInterior() {
      const W = canvas.width;
      const H = canvas.height;

      const wallGrad = ctx.createLinearGradient(0, 0, 0, H * 0.75);
      wallGrad.addColorStop(0, '#6a6a62');
      wallGrad.addColorStop(1, '#54544c');
      ctx.fillStyle = wallGrad;
      ctx.fillRect(0, 0, W, H * 0.75);

      ctx.fillStyle = 'rgba(30,35,25,0.2)';
      for (let i = 0; i < 6; i++) {
        const sx = 20 + i * (W / 6) + Math.sin(i) * 10;
        ctx.beginPath();
        ctx.moveTo(sx, 0);
        ctx.lineTo(sx + 4, H * (0.3 + (i % 3) * 0.15));
        ctx.lineTo(sx - 4, H * (0.3 + (i % 3) * 0.15));
        ctx.closePath();
        ctx.fill();
      }

      ctx.fillStyle = '#3f3f38';
      for (let x = 40; x < W; x += 160) {
        ctx.fillRect(x, 0, 24, H * 0.12);
      }

      drawGaragePillar(180, H * 0.12, H * 0.63);
      drawGaragePillar(480, H * 0.12, H * 0.63);

      ctx.fillStyle = '#7a7a70';
      ctx.fillRect(0, H * 0.75, W, H * 0.25);

      ctx.fillStyle = 'rgba(40,45,35,0.3)';
      drawPuddle(120, H * 0.88, 40, 12);
      drawPuddle(520, H * 0.92, 30, 9);
      drawPuddle(340, H * 0.8, 22, 7);

      ctx.strokeStyle = 'rgba(232,201,74,0.35)';
      ctx.lineWidth = 3;
      for (let x = 30; x < W; x += 130) {
        ctx.beginPath();
        ctx.moveTo(x, H * 0.78);
        ctx.lineTo(x, H);
        ctx.stroke();
      }

      drawParkedCar(340, H * 0.88);
      drawCarRamp(140, H * 0.75);
      drawStairwell(W - 180, H * 0.75, 150, H * 0.55);

      drawShopDoor(20, H * 0.75 - 70, '#2a2a26');
      ctx.fillStyle = '#e8c94a';
      ctx.font = '12px Courier New';
      ctx.fillText('◄ Street', 5, H * 0.75 - 78);
    }

    function drawParkingGarageLevel2() {
      const W = canvas.width;
      const H = canvas.height;

      const wallGrad = ctx.createLinearGradient(0, 0, 0, H * 0.75);
      wallGrad.addColorStop(0, '#68685f');
      wallGrad.addColorStop(1, '#52524a');
      ctx.fillStyle = wallGrad;
      ctx.fillRect(0, 0, W, H * 0.75);

      ctx.fillStyle = 'rgba(30,35,25,0.12)';
      for (let i = 0; i < 4; i++) {
        const sx = 60 + i * (W / 4);
        ctx.fillRect(sx, 0, 4, H * 0.25);
      }

      ctx.fillStyle = '#3f3f38';
      for (let x = 40; x < W; x += 160) {
        ctx.fillRect(x, 0, 24, H * 0.12);
      }

      drawBigPillar(W * 0.42, H * 0.1, H * 0.65);

      ctx.fillStyle = '#78786e';
      ctx.fillRect(0, H * 0.75, W, H * 0.25);

      ctx.strokeStyle = 'rgba(232,201,74,0.3)';
      ctx.lineWidth = 3;
      for (let x = 30; x < W; x += 130) {
        ctx.beginPath();
        ctx.moveTo(x, H * 0.78);
        ctx.lineTo(x, H);
        ctx.stroke();
      }

      ctx.fillStyle = 'rgba(40,45,35,0.15)';
      drawPuddle(550, H * 0.9, 26, 8);

      drawParkedCarBlack(90, H * 0.88);
      drawBigRampUp(W - 260, H * 0.3, 240, H * 0.65);

      drawShopDoor(20, H * 0.75 - 70, '#2a2a26');
      ctx.fillStyle = '#e8c94a';
      ctx.font = '12px Courier New';
      ctx.fillText('◄ Down', 5, H * 0.75 - 78);
    }

    function drawParkingGarageLevel3() {
      const W = canvas.width, H = canvas.height;
      const wallGrad = ctx.createLinearGradient(0, 0, 0, H * 0.75);
      wallGrad.addColorStop(0, '#5a5a52');
      wallGrad.addColorStop(1, '#484840');
      ctx.fillStyle = wallGrad;
      ctx.fillRect(0, 0, W, H * 0.75);
      ctx.fillStyle = '#6a6a62';
      ctx.fillRect(0, H * 0.75, W, H * 0.25);
      ctx.fillStyle = '#e8c94a'; ctx.font = '16px Courier New'; ctx.textAlign = 'center';
      ctx.fillText('Parking Garage — Level 3', W / 2, 50);
      ctx.font = '12px Courier New'; ctx.fillStyle = '#aaa';
      ctx.fillText('(Coming soon)', W / 2, 80);
      ctx.textAlign = 'left';
      drawShopDoor(50, 300, '#2a2a26');
      ctx.fillStyle = '#e8c94a'; ctx.font = '12px Courier New';
      ctx.fillText('◄ Level 2', 40, 290);
    }

    function drawWeaponStoreInterior() {
      const W = canvas.width, H = canvas.height;
      ctx.fillStyle = '#6b5a4a'; ctx.fillRect(0, 0, W, H*0.75);
      ctx.fillStyle = '#8a6a4a'; ctx.fillRect(0, H*0.75, W, H*0.25);
      ctx.strokeStyle = '#6a4a30'; ctx.lineWidth = 1;
      for (let x = 0; x < W; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, H*0.75); ctx.lineTo(x, H); ctx.stroke();
      }
      drawShelfWithSwords(60, H*0.12, 200, H*0.3);
      drawShelfWithSwords(320, H*0.12, 200, H*0.3);
      drawCounter(W-260, H*0.55, 200, 90, '#5a3b28');
      drawBook(W-200, H*0.55-14);
      drawShopDoor(55, 220, '#3a2a20');
      ctx.fillStyle = '#f2d98b'; ctx.font = '12px Courier New';
      ctx.fillText('◄ Street', 40, 210);
    }

    function drawClothingStoreInterior() {
      const W = canvas.width, H = canvas.height;
      ctx.fillStyle = '#c48fae'; ctx.fillRect(0, 0, W, H*0.75);
      ctx.fillStyle = '#e8d9c9'; ctx.fillRect(0, H*0.75, W, H*0.25);
      ctx.strokeStyle = '#c9b89a'; ctx.lineWidth = 1;
      for (let x = 0; x < W; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, H*0.75); ctx.lineTo(x, H); ctx.stroke();
      }
      drawClothingRack(60, H*0.2, 220);
      drawClothingRack(340, H*0.2, 220);
      drawCounter(W-260, H*0.55, 200, 90, '#7a4a5a');
      drawBook(W-200, H*0.55-14);
      drawShopDoor(55, 220, '#7a4a5a');
      ctx.fillStyle = '#3d2818'; ctx.font = '12px Courier New';
      ctx.fillText('◄ Street', 40, 210);
    }

    function drawBarInterior() {
      const W = canvas.width, H = canvas.height;
      ctx.fillStyle = '#3a2a20'; ctx.fillRect(0, 0, W, H*0.75);
      ctx.fillStyle = '#4a3a2a'; ctx.fillRect(0, H*0.75, W, H*0.25);
      ctx.strokeStyle = '#2a1f18'; ctx.lineWidth = 1;
      for (let x = 0; x < W; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, H*0.75); ctx.lineTo(x, H); ctx.stroke();
      }
      drawCounter(W-260, H*0.5, 200, 100, '#2a1f18');
      drawBottleShelf(W-250, H*0.18, 180);
      drawBottle(W-240, H*0.5+4, '#8a3a3a');
      drawBottle(W-224, H*0.5+4, '#3a5a8a');
      drawBottle(W-208, H*0.5+4, '#5a8a4a');
      drawTableAndChairs(130, H*0.68);
      drawTableAndChairs(320, H*0.7);
      drawShopDoor(35, 220, '#2a1f18');
      ctx.fillStyle = '#e8c94a'; ctx.font = '12px Courier New';
      ctx.fillText('◄ Street', 20, 210);
    }

    function draw() {
      if (currentRoom === 'room') drawRoom();
      else if (currentRoom === 'hallway') drawHallway();
      else if (currentRoom === 'kitchen') drawKitchen();
      else if (currentRoom === 'outside') drawCity();
      else if (currentRoom === 'garageStreet') drawGarageStreet();
      else if (currentRoom === 'parkingGarage') drawParkingGarageInterior();
      else if (currentRoom === 'stairwell') drawStairwellInterior();
      else if (currentRoom === 'parkingGarageLevel2') drawParkingGarageLevel2();
      else if (currentRoom === 'parkingGarageLevel3') drawParkingGarageLevel3();
      else if (currentRoom === 'garageTopFloor') drawGarageTopFloor();
      else if (currentRoom === 'clearing') drawClearing();
      else if (currentRoom === 'weaponStore') drawWeaponStoreInterior();
      else if (currentRoom === 'clothingStore') drawClothingStoreInterior();
      else if (currentRoom === 'bar') drawBarInterior();

      // Draw Ani
      const drawW = frameW * ani.scale, drawH = frameH * ani.scale;
      ctx.fillStyle = 'rgba(0,0,0,0.28)';
      ctx.beginPath();
      ctx.ellipse(ani.x + drawW/2, ani.y + drawH - 6, drawW*0.30, 10, 0, 0, Math.PI*2);
      ctx.fill();

      if (sheet.complete && sheet.naturalWidth > 0) {
        const clean = getCleanFrame(ani.frame);
        ctx.save();
        if (ani.facing === -1) {
          ctx.translate(ani.x + drawW, ani.y); ctx.scale(-1, 1);
          ctx.drawImage(clean, 0, 0, frameW, frameH, 0, 0, drawW, drawH);
        } else {
          ctx.drawImage(clean, 0, 0, frameW, frameH, ani.x, ani.y, drawW, drawH);
        }
        ctx.restore();
      }

      // Draw Neko
      if (nekoSheet.complete && nekoSheet.naturalWidth > 0) {
        const nw = nekoFrameW * neko.scale;
        const nh = nekoFrameH * neko.scale;
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.beginPath();
        ctx.ellipse(neko.x + nw/2, neko.y + nh - 4, nw*0.28, 8, 0, 0, Math.PI*2);
        ctx.fill();

        const cleanNeko = getCleanNekoFrame(neko.frame);
        ctx.save();
        if (neko.facing === -1) {
          ctx.translate(neko.x + nw, neko.y); ctx.scale(-1, 1);
          ctx.drawImage(cleanNeko, 0, 0, nekoFrameW, nekoFrameH, 0, 0, nw, nh);
        } else {
          ctx.drawImage(cleanNeko, 0, 0, nekoFrameW, nekoFrameH, neko.x, neko.y, nw, nh);
        }
        ctx.restore();
      }

      // Draw menu on top if open
      if (activeMenu === 'map') {
        drawMapMenu();
      }
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }
  </script>
